<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mock</title>
<!-- The page around a mock's variants: scripts/mock.mjs copies it, harness.js and a data.js
     into the output folder. Its colours are the app's own tokens, so it reads as one piece. -->
<style>
:root { --bg:#101312; --surface:#171b1a; --fg:#e7ecea; --muted:#9aa5a1; --line:#2a312f; --accent:#4cc38a; --accent-bg:#173327; color-scheme:dark; }
:root.light { --bg:#f5f7f6; --surface:#fff; --fg:#17201d; --muted:#5d6a65; --line:#dfe5e2; --accent:#146c43; --accent-bg:#ddf3e8; color-scheme:light; }
* { box-sizing:border-box; }
html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
body { display:flex; flex-direction:column; }
button { font:inherit; color:inherit; border:1px solid var(--line); background:var(--bg); border-radius:8px; min-height:32px; padding:0 10px; cursor:pointer; white-space:nowrap; }
button:disabled { opacity:.4; cursor:default; }
button[aria-pressed=true] { background:var(--accent-bg); color:var(--accent); border-color:var(--accent); font-weight:600; }
select { font:inherit; color:var(--fg); background:var(--surface); border:1px solid var(--line); border-radius:6px; }
#bar { display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:6px 12px; border-bottom:1px solid var(--line); background:var(--surface); }
#bar h1 { font-size:15px; margin:0; }
.seg { display:inline-flex; flex-wrap:wrap; gap:4px; }
.gap { flex:1; }
#stage { flex:1; min-height:0; display:flex; gap:16px; justify-content:safe center; overflow:auto; }
figure { margin:0; display:flex; flex-direction:column; flex:none; }
figcaption { height:28px; display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
iframe { flex:1; border:0; display:block; background:var(--bg); }
#pill { position:fixed; right:12px; bottom:calc(12px + env(safe-area-inset-bottom)); z-index:2; opacity:.85; border-radius:999px; background:var(--surface); box-shadow:0 2px 8px #0006; }
body.hidden #bar, body.hidden figcaption { display:none; }
#note { position:fixed; top:0; right:0; bottom:0; z-index:3; width:min(560px, 100%); padding:0 20px 24px; overflow:auto; background:var(--surface); border-left:1px solid var(--line); }
#note .close { position:sticky; top:12px; float:right; }
#note code, #note pre { font:12px ui-monospace, SFMono-Regular, Menlo, monospace; }
/* A phone shows the app full screen: options and views at the foot, no widths, no A/B. */
body.phone #bar { order:1; gap:6px; padding:6px 8px calc(6px + env(safe-area-inset-bottom)); border:0; border-top:1px solid var(--line); }
body.phone #bar h1, body.phone .desktop, body.phone .gap, body.phone figcaption { display:none; }
body.phone button { min-height:30px; padding:0 8px; font-size:13px; }
body.phone .seg { flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; }
body.phone #variants { flex:1 0 70%; min-width:0; } body.phone #views { flex:1 0 50%; min-width:0; }
body.phone #hide { order:1; } body.phone #views, body.phone #theme, body.phone #note-btn { order:2; } body.phone #desc { order:3; }
body.phone #desc { flex-basis:100%; font-size:12px; color:var(--muted); overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
body:not(.phone) #desc { display:none; }
body.phone figure { flex:1; }
</style>
</head>
<body>
<header id="bar">
  <h1 id="title"></h1>
  <span class="seg" id="variants" role="group" aria-label="Option"></span>
  <span class="seg" id="views" role="group" aria-label="View"></span>
  <span class="gap"></span>
  <span class="seg desktop" id="widths" role="group" aria-label="Width"></span>
  <button class="desktop" id="ab" title="Two options side by side, when both fit at this width">A | B</button>
  <button id="theme">Theme</button>
  <button id="note-btn" aria-expanded="false">Note</button>
  <button id="hide" title="Hide the controls (h)">Hide</button>
  <span id="desc"></span>
</header>
<main id="stage"></main>
<button id="pill" hidden title="Show the controls (h)"></button>
<aside id="note" hidden><button class="close" id="note-close">Close</button><div id="note-body"></div></aside>
<script src="data.js"></script>
<script src="harness.js"></script>
</body>
</html>
