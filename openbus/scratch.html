<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Scratch</title>
<style>/*tokens*/
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
main { max-width: 1040px; margin: auto; padding: 16px; }
header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
h1 { font-size: 28px; font-weight: 750; margin: 0 auto 0 0; }
header a { color: var(--muted); }
input { width: 100%; height: 44px; margin-bottom: 16px; padding: 0 12px; font: inherit; font-size: 16px; color: inherit; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
#cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
article { display: flex; flex-direction: column; gap: 6px; min-width: 0; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.thumb { display: block; aspect-ratio: 8 / 5; margin: -12px -14px 4px; overflow: hidden; background: var(--raised); border-radius: 7px 7px 0 0; border-bottom: 1px solid var(--line); }
.thumb img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; }
/* A phone keeps the thumbnail small, beside the text, so a screen still holds several. */
@media (max-width: 600px) {
  article { display: grid; grid-template-columns: 104px minmax(0, 1fr); column-gap: 12px; align-content: start; }
  .thumb { grid-row: 1 / span 4; margin: 2px 0 0; border: 1px solid var(--line); border-radius: 6px; }
  article > :not(.thumb) { grid-column: 2; }
}
h2 { margin: 0; font-size: 16px; line-height: 1.35; overflow-wrap: anywhere; }
h2 a { color: var(--fg); text-decoration: none; }
p { margin: 0; overflow-wrap: anywhere; }
.desc { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
.by { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13px; }
.who { padding: 2px 8px; font: inherit; color: var(--accent); background: var(--accent-bg); border: 0; border-radius: 999px; cursor: pointer; }
.where { color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
.muted { color: var(--muted); font-size: 13px; }
a { color: var(--accent); }
</style></head><body><main>
<header><h1>Scratch</h1><a href="/m/">tmux-rc</a></header>
<input type="search" placeholder="Filter by title, agent or session" aria-label="Filter">
<section id="cards"><!--cards--></section></main>
<script>
// Sandboxed like every /scratch/ page, so there is no localStorage: follow the system theme.
document.documentElement.classList.toggle("light", matchMedia("(prefers-color-scheme: light)").matches);
const ago = (s) => { const d = Date.now() / 1000 - s;
  return d < 3600 ? `${Math.max(1, Math.round(d / 60))}m ago` : d < 86400 ? `${Math.round(d / 3600)}h ago`
    : d < 7 * 86400 ? `${Math.round(d / 86400)}d ago` : new Date(s * 1000).toLocaleDateString(); };
for (const t of document.querySelectorAll("time")) t.textContent = ago(+t.dataset.t);
const box = document.querySelector("input");
const filter = () => { const q = box.value.trim().toLowerCase();
  for (const a of document.querySelectorAll("article")) a.hidden = !a.dataset.q.includes(q); };
box.addEventListener("input", filter);
for (const b of document.querySelectorAll(".who")) b.onclick = () => { box.value = b.textContent; filter(); };
</script></body></html>
