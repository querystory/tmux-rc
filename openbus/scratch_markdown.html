<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title><!--title--></title>
<style>/*tokens*/
/*pygments*/
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
nav { position: sticky; top: 0; z-index: 1; display: flex; justify-content: flex-end; gap: 6px; padding: 8px 16px; background: var(--bg); border-bottom: 1px solid var(--line); }
nav :is(a, button) { display: inline-flex; align-items: center; min-height: 32px; padding: 0 10px; font: inherit; font-size: 13px; color: var(--fg); text-decoration: none; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
article { max-width: 860px; margin: 0 auto; padding: 8px 16px 64px; overflow-wrap: anywhere; }
a { color: var(--accent); }
:is(h1, h2, h3, h4, h5, h6) { line-height: 1.25; margin: 1.6em 0 .6em; }
h1 { font-size: 2em; margin-top: .5em; }
h2 { font-size: 1.5em; padding-bottom: .2em; border-bottom: 1px solid var(--line); }
.headerlink { margin-left: .3em; color: var(--muted); text-decoration: none; opacity: 0; }
:is(h1, h2, h3, h4, h5, h6):hover .headerlink, .headerlink:focus { opacity: 1; }
code, pre { font-family: var(--mono); }
:not(pre) > code { padding: .1em .35em; font-size: .875em; background: var(--raised); border-radius: 4px; }
/* Wide code and tables scroll inside themselves, never the page (a phone's column). */
pre { padding: 12px 14px; overflow-x: auto; font-size: 14px; line-height: 1.5; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
.highlight { color: var(--fg); }
.highlight pre { background: inherit; }
table { display: block; width: max-content; max-width: 100%; overflow-x: auto; border-collapse: collapse; margin: 1em 0; }
th, td { padding: 6px 10px; text-align: left; vertical-align: top; border: 1px solid var(--line); overflow-wrap: normal; }
th { background: var(--surface); }
img { max-width: 100%; }
blockquote { margin: 1em 0; padding: 0 1em; color: var(--muted); border-left: 4px solid var(--line); }
dt { font-weight: 600; }
.task-list { list-style: none; padding-left: 1.4em; }
.task-list-item input { margin: 0 .5em 0 -1.4em; }
.footnote { color: var(--muted); font-size: .9em; }
pre.mermaid { text-align: center; background: none; border: 0; }
/* Admonitions (and ???, a <details> with a type) in Material's colours, by type: the
   base rule is :where(), weightless, so each type's colour below wins over its default. */
:where(.admonition, details[class]) { --c: #448aff; margin: 1em 0; padding: 0 14px 1px; background: color-mix(in srgb, var(--c) 7%, var(--surface)); border-left: 4px solid var(--c); border-radius: 4px; }
:is(.admonition-title, details[class] > summary) { margin: 0 -14px; padding: 6px 14px; font-weight: 600; background: color-mix(in srgb, var(--c) 16%, transparent); }
details[class]:not([open]) { padding-bottom: 0; }
summary { cursor: pointer; }
:is(.abstract, .summary, .tldr) { --c: #00b0ff; }
:is(.info, .todo) { --c: #00b8d4; }
:is(.tip, .hint) { --c: #00bfa5; }
:is(.success, .check, .done) { --c: #00c853; }
:is(.question, .help, .faq) { --c: #64dd17; }
:is(.warning, .caution, .attention) { --c: #ff9100; }
:is(.failure, .fail, .missing) { --c: #ff5252; }
:is(.danger, .error) { --c: #ff1744; }
.bug { --c: #f50057; }
:is(.example, .important) { --c: #7c4dff; }
:is(.quote, .cite) { --c: #9e9e9e; }
</style>
<script>
// In <head>, so no raw HTML in the body (an unclosed <title> swallows the rest) can stop it.
// Sandboxed like every /scratch/ page, so no localStorage: the app's theme when it frames the
// page and says so, else the system's, light unless it asks for dark.
const root = document.documentElement;
root.classList.toggle("light", !matchMedia("(prefers-color-scheme: dark)").matches);
addEventListener("message", (e) => {
  if (e.source !== parent || typeof e.data?.light !== "boolean" || e.data.light === root.classList.contains("light")) return;
  root.classList.toggle("light", e.data.light);
  window.drawMermaid?.(); // its diagrams are drawn in one theme
});
</script></head><body>
<nav><button type="button" data-copy="markdown">Copy Markdown</button><button type="button" data-copy="formatted">Copy formatted</button><a href="?raw">Source</a></nav>
<article><!--body--></article>
<textarea hidden><!--source--></textarea>
<!--mermaid-->
<script>
// Drawn from their sources each time, so a theme the app sends later redraws them in it.
const diagrams = [...document.querySelectorAll("pre.mermaid")].map((pre) => [pre, pre.textContent]);
function drawMermaid() {
  if (!window.mermaid?.initialize) return; // a "Mermaid" heading alone is window.mermaid too
  mermaid.initialize({ startOnLoad: false, theme: root.classList.contains("light") ? "default" : "dark" });
  for (const [pre, source] of diagrams) { pre.removeAttribute("data-processed"); pre.textContent = source; }
  mermaid.run();
}
drawMermaid();
const article = document.querySelector("article");
const copy = async (data) => {
  try {
    await navigator.clipboard.write([new ClipboardItem(Object.fromEntries(
      Object.entries(data).map(([type, text]) => [type, new Blob([text], { type })])))]);
  } catch { // a sandboxed page may be refused the async clipboard; a copy event still sets it
    const set = (e) => { for (const [type, text] of Object.entries(data)) e.clipboardData.setData(type, text); e.preventDefault(); };
    document.addEventListener("copy", set);
    document.execCommand("copy");
    document.removeEventListener("copy", set);
  }
};
for (const b of document.querySelectorAll("[data-copy]")) b.onclick = async () => {
  const label = b.textContent;
  await copy(b.dataset.copy === "markdown" ? { "text/plain": document.querySelector("body > textarea").value }
    : { "text/html": article.innerHTML, "text/plain": article.innerText });
  b.textContent = "Copied";
  setTimeout(() => { b.textContent = label; }, 1500);
};
</script></body></html>
