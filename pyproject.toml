[project]
name = "tmux-rc"
version = "0.1.0"
description = "Vendor-agnostic phone control plane for terminal AI agents running in tmux"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "google-genai>=0.3",
    "python-multipart>=0.0.32",
    "pillow>=12.3.0",
    "opentelemetry-sdk>=1.43.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.43.0",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["daemon"]

[tool.hatch.build.targets.wheel.force-include]
"daemon/parser_prompt.txt" = "daemon/parser_prompt.txt"
"daemon/live_prompt.txt" = "daemon/live_prompt.txt"
"daemon/bootstrap_prompt.txt" = "daemon/bootstrap_prompt.txt"
