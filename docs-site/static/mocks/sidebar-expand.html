<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sidebar Expand Models</title>
<style>
/* Tokens: copied from web/m/style.css so the frame reads as the real app. */
:root {
  color-scheme: dark;
  --bg: #101312; --surface: #191d1b; --raised: #252b28; --line: #343d38;
  --fg: #edf2ef; --muted: #a1ada6; --accent: #83ddb3; --accent-bg: #193c2c; --lift: #2b322f;
  --amber: #f1c56a; --amber-bg: #352d1c; --red: #ff9696; --purple: #a371f7;
}
:root.light {
  color-scheme: light;
  --bg: #f5f7f6; --surface: #fff; --raised: #e7ede9; --line: #ccd7d0;
  --fg: #1b2821; --muted: #53655b; --accent: #146b46; --accent-bg: #dcf4e7; --lift: #fff;
  --amber: #815600; --amber-bg: #fff2d4; --red: #b52c36; --purple: #8250df;
}
* { box-sizing: border-box; letter-spacing: 0; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: transparent; border: 0; border-radius: 6px; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg { flex-shrink: 0; vertical-align: middle; }
p { margin: 0; }

/* ── Mock chrome (outside the app frame) ─────────────────────────── */
.mk-top { height: 52px; display: flex; align-items: center; gap: 14px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
.mk-top h1 { margin: 0; font-size: 14px; font-weight: 650; white-space: nowrap; }
.mk-top h1 small { color: var(--muted); font-weight: 500; }
.mk-tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; min-width: 0; }
.mk-tabs button { min-height: 34px; padding: 0 12px; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.mk-tabs button b { color: var(--fg); margin-right: 6px; font-weight: 700; }
.mk-tabs button:hover { background: var(--raised); }
.mk-tabs button[aria-pressed="true"] { background: var(--accent-bg); color: var(--accent); }
.mk-tabs button[aria-pressed="true"] b { color: var(--accent); }
.mk-main { display: grid; grid-template-columns: minmax(0, 1fr) 350px; height: calc(100% - 52px); }
.mk-stage { position: relative; overflow: hidden; padding: 14px 0 14px 16px; }
.mk-stage.actual { overflow: auto; padding-right: 16px; }
.mk-stage:not(.actual)::after { content: ""; position: absolute; top: 0; right: 0; bottom: 0; width: 48px; background: linear-gradient(to right, transparent, var(--bg)); pointer-events: none; }
.mk-holder { position: relative; }
.mk-aside { overflow-y: auto; border-left: 1px solid var(--line); background: var(--surface); padding: 14px 16px 24px; font-size: 13px; line-height: 1.45; }
.mk-aside h2 { margin: 0 0 4px; font-size: 16px; }
.mk-aside h3 { margin: 16px 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.mk-aside p { margin: 0 0 8px; }
.mk-aside ul { margin: 0; padding-left: 18px; }
.mk-aside li { margin-bottom: 4px; }
.mk-set { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; align-items: center; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.mk-set > span { color: var(--muted); font-size: 12px; }
.mk-seg { display: inline-flex; gap: 2px; padding: 2px; border-radius: 7px; background: var(--raised); justify-self: start; }
.mk-seg button { min-height: 24px; padding: 1px 9px; border-radius: 5px; font-size: 12px; color: var(--muted); }
.mk-seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / .18); }
.mk-check { display: flex; gap: 8px; align-items: flex-start; margin: 8px 0 0; padding: 8px 10px; border-radius: 8px; background: var(--raised); font-size: 12.5px; cursor: pointer; }
.mk-check input { margin-top: 3px; accent-color: var(--accent); }
.mk-trade { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.mk-trade th { width: 92px; text-align: left; vertical-align: top; padding: 6px 8px 6px 0; color: var(--muted); font-weight: 600; }
.mk-trade td { padding: 6px 0; vertical-align: top; }
.mk-trade tr + tr > * { border-top: 1px solid var(--line); }
.mk-metric { display: grid; gap: 2px; padding: 8px 10px; border-radius: 8px; background: var(--accent-bg); color: var(--fg); font-size: 12.5px; }
.mk-metric b { font-variant-numeric: tabular-nums; }
.mk-only { margin-bottom: 12px; padding: 8px 10px; border-radius: 8px; background: var(--amber-bg); color: var(--fg); font-size: 13px; }
.mk-only b { color: var(--amber); }
.mk-reset { margin-top: 14px; min-height: 30px; padding: 0 12px; border: 1px solid var(--line); font-size: 12.5px; }
.mk-reset:hover { background: var(--raised); }
kbd, .mk-k { font: 600 11.5px/1 inherit; padding: 2px 5px; border-radius: 4px; background: var(--raised); white-space: nowrap; }
@media (max-width: 900px) {
  body { overflow: auto; }
  .mk-top { height: auto; flex-wrap: wrap; padding: 8px 16px; }
  .mk-tabs { width: 100%; }
  .mk-main { display: block; height: auto; }
  .mk-stage { height: 70vh; }
  .mk-aside { border-left: 0; border-top: 1px solid var(--line); }
}

/* ── The app frame: a 1440×900 or 1920×1080 screen ─────────────────── */
.frame { position: absolute; top: 0; left: 0; transform-origin: 0 0; display: grid; grid-template-columns: 300px minmax(0, 1fr); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; box-shadow: 0 6px 30px rgb(0 0 0 / .25); --bar: 46px; }
.frame button { min-height: 44px; }
.frame button:not(:disabled):hover { background: var(--raised); --card: var(--raised); }
#sessions { border-right: 1px solid var(--line); background: var(--surface); --card: var(--surface); display: flex; flex-direction: column; overflow: hidden; min-height: 0; }
#sb-head { display: flex; align-items: center; gap: 2px; min-height: var(--bar); padding: 0 8px 0 14px; flex: none; }
#brand { display: flex; align-items: center; gap: 8px; margin-right: auto; font-size: 16px; font-weight: 650; }
#sb-nav, #sb-foot { display: flex; align-items: center; gap: 2px; padding: 0 8px 6px; flex: none; }
#sb-foot { padding-block: 6px; border-top: 1px solid var(--line); }
.icon-button { width: 36px; height: 36px; min-height: 36px !important; padding: 0; display: inline-flex; align-items: center; justify-content: center; flex: none; border-radius: 8px; }
#new-window { flex: 1; width: auto; justify-content: flex-start; gap: 8px; padding: 0 10px; font-size: 14px; font-weight: 600; white-space: nowrap; color: var(--accent); }
#connection { margin: 0 auto 0 6px; color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 6px; }
#connection::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.search { margin: 2px 12px 6px; display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 0 12px; color: var(--muted); flex: none; }
.search input { min-width: 0; width: 100%; height: 36px; background: none; border: 0; outline: none; font-size: 14px; }
.search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
#side-list { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; padding-bottom: 8px; font-size: 13px; }

/* Sidebar rules: web/m/style.css (main + #312), with mock-only additions marked. */
.sb-icon { width: 32px; height: 32px; min-height: 32px !important; padding: 0; flex: none; display: inline-flex; align-items: center; justify-content: center; color: var(--muted); }
.sb-icon[aria-pressed="true"] { color: var(--accent); background: var(--accent-bg); }
.sb-bar { white-space: nowrap; display: flex; align-items: center; gap: 6px; padding: 10px 8px 2px 16px; color: var(--muted); font-size: 12px; font-weight: 600; }
.seg { display: inline-flex; gap: 2px; padding: 2px; border-radius: 7px; background: var(--raised); }
.seg button { min-height: 22px !important; padding: 1px 8px; border-radius: 5px; font-size: 11.5px; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / .18); }
.seg button[aria-pressed="true"]:hover { background: var(--surface) !important; }
.pick { margin-left: auto; position: relative; display: inline-flex; align-items: center; }
.pick select { appearance: none; field-sizing: content; min-height: 28px; padding: 2px 20px 2px 6px; border: 0; border-radius: 5px; background: transparent; color: var(--muted); font-size: 12px; font-weight: 600; cursor: pointer; }
.pick select:hover { background: var(--raised); }
.pick::after { content: ""; position: absolute; right: 7px; top: 9px; width: 6px; height: 6px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(45deg); pointer-events: none; }
/* mock-only: the labelled second bar row some options add (Show / Tree / View). */
.sb-bar2 { display: flex; align-items: center; gap: 6px; padding: 4px 8px 2px 16px; color: var(--muted); font-size: 12px; font-weight: 600; }
.sb-bar2 > span:first-child { min-width: 34px; }
.sb-bar2 .tb { min-height: 26px !important; padding: 0 8px; display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; color: var(--muted); border-radius: 6px; }
.sb-bar2 .tb:disabled { opacity: .45; cursor: default; }
.sb-bar2 .n { font-variant-numeric: tabular-nums; color: var(--accent); font-weight: 700; }
.sb-group { display: flex; align-items: center; gap: 2px; margin: 4px 6px 0; }
.sb-fold { flex: 1; min-width: 0; min-height: 32px !important; display: flex; align-items: center; gap: 6px; padding: 0 8px; text-align: left; font-size: 12.5px; font-weight: 600; }
.sb-fold > svg { color: var(--muted); }
.sb-fold > svg + svg { color: var(--amber); }
.sb-fold .l { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sb-fold .c { margin-left: auto; display: flex; align-items: center; gap: 5px; color: var(--muted); font-size: 11.5px; font-weight: 500; font-variant-numeric: tabular-nums; }
.sb-fold .c i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.sb-row, .sb-card { display: flex; flex-wrap: wrap; align-items: flex-start; margin: 0 6px; border-radius: 7px; }
:is(.sb-row, .sb-card) > :not(.sb-open, .sb-sub, .twisty) { flex-basis: 100%; }
.sb-open { flex: 1; min-width: 0; min-height: 32px !important; display: flex; align-items: center; gap: 9px; padding: 0 8px 0 10px; border-radius: inherit; text-align: left; white-space: nowrap; }
.sb-open .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sb-open b { font-weight: 500; }
.sb-card b { font-weight: 600; }
.sb-open .s { color: var(--muted); font-size: 11.5px; }
.sb-open .a { flex: none; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.sb-sub { min-height: 32px !important; display: inline-flex; align-items: center; gap: 3px; padding: 0 6px; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.sb-sub > svg:first-child { color: var(--accent); }
.sb-card .sb-sub { margin-top: 2px; }
.sb-agents { display: grid; padding: 0 8px 4px 41px; }
.agent { display: flex; min-width: 0; align-items: center; gap: 6px; min-height: 22px; font-size: 12px; white-space: nowrap; }
.agent svg { width: 11px; height: 11px; flex: none; color: var(--accent); }
.agent.compacting svg { color: var(--purple); }
.agent.done { color: var(--muted); }
.agent.done svg { color: var(--muted); }
.agent > span:nth-child(2) { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.agent small { margin-left: auto; color: var(--muted); font-size: 11px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.need .a { color: var(--amber); font-weight: 700; }
.sb-logo { position: relative; flex: none; width: 22px; height: 22px; display: grid; place-items: center; }
.sb-logo img { width: 20px; height: 20px; object-fit: contain; }
.model-badge { position: absolute; width: 11px !important; height: 11px !important; padding: 1px; right: -4px; bottom: -4px; border-radius: 50%; background: var(--card, var(--bg)); }
.sb-card { margin-bottom: 4px; border-radius: 9px; }
.sb-card.need { background: var(--amber-bg); --card: var(--amber-bg); }
.sb-card .sb-open { flex-wrap: wrap; align-items: flex-start; row-gap: 2px; padding: 7px 10px; white-space: normal; }
.sb-open p { flex-basis: 100%; padding-left: 31px; color: var(--muted); font-size: 12px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.sb-replies { display: flex; flex-wrap: wrap; gap: 5px; padding: 0 10px 8px 41px; }
.sb-replies button { min-height: 28px !important; max-width: 100%; padding: 0 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); font-size: 12px; font-weight: 600; }
.sb-replies button:not(:disabled):hover { border-color: var(--amber); background: var(--surface); }
.sb-open:not(:disabled):hover { background: transparent !important; }
:is(.sb-row, .sb-card):not(.need):not([aria-current="true"]):hover { background: var(--raised); }
:is(.sb-row, .sb-card)[aria-current="true"] { background: var(--lift); --card: var(--lift); box-shadow: inset 3px 0 var(--fg), inset 0 0 0 1px color-mix(in srgb, var(--fg) 45%, transparent); }
.sb-card.need[aria-current="true"] { background: var(--amber-bg); --card: var(--amber-bg); }
:is(.sb-row, .sb-card)[aria-current="true"] b { font-weight: 800; }
/* mock-only: a static sub-agent count (E1, E5, E6) — same look as #312's toggle, minus the chevron. */
.sb-badge { flex: none; display: inline-flex; align-items: center; gap: 3px; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.sb-badge svg { color: var(--accent); }
/* mock-only E4: one dot per sub-agent. */
.strip { flex: none; display: inline-flex; align-items: center; gap: 2px; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.strip i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.strip i.compacting { background: var(--purple); }
.strip i.done { background: transparent; box-shadow: inset 0 0 0 1.2px var(--muted); }
.strip span { margin-left: 3px; }
/* mock-only E3: file-tree disclosure and indented children with a guide line. */
.twisty { flex: none; width: 18px; min-height: 32px !important; padding: 0; margin-right: -6px; display: inline-flex; align-items: center; justify-content: center; color: var(--muted); border-radius: 5px; }
.sb-card > .twisty { margin-top: 4px; min-height: 28px !important; }
.sb-agents.tree { position: relative; padding-left: 47px; }
.sb-agents.tree::before { content: ""; position: absolute; left: 33px; top: -4px; bottom: 14px; border-left: 1px solid var(--line); }
.sb-agents.tree .agent::before { content: ""; width: 8px; margin-left: -14px; border-top: 1px solid var(--line); flex: none; }
/* mock-only E7: one labelled switch for every pane's sub-agents. */
.sw { min-height: 30px !important; display: inline-flex; align-items: center; gap: 6px; padding: 0 6px 0 10px; border: 1px solid var(--line); border-radius: 999px; font-size: 12px; font-weight: 600; color: var(--fg); }
.sw .n { color: var(--muted); }
.sw .knob { width: 28px; height: 16px; border-radius: 8px; background: var(--raised); box-shadow: inset 0 0 0 1px var(--line); position: relative; }
.sw .knob::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--muted); transition: transform .15s; }
.sw[aria-checked="true"] { border-color: var(--accent); background: var(--accent-bg) !important; color: var(--accent); }
.sw[aria-checked="true"] .n { color: var(--accent); }
.sw[aria-checked="true"] .knob { background: var(--accent); box-shadow: none; }
.sw[aria-checked="true"] .knob::after { transform: translateX(12px); background: var(--bg); }
/* mock-only E6: the Agents view's parent row and footnote. */
.ag-parent .sb-open b { font-weight: 600; }
.ag-parent + .sb-agents { padding-bottom: 6px; }
.sb-note { margin: 10px 16px 0; color: var(--muted); font-size: 12px; }
.sb-note button { min-height: 0 !important; padding: 0; color: var(--accent); font-size: 12px; text-decoration: underline; }
/* Working logo, as in the app. */
.working { border-radius: 50%; background: var(--accent-bg); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent), 0 0 0 1px var(--accent); }
@media (prefers-reduced-motion: no-preference) { .working { animation: logo-clench 1.4s ease-in-out infinite; } .working[data-tool="codex"] { animation: logo-spin 3s linear infinite; } .working[data-tool="omp"] { animation: none; border-radius: 19%; } }
@keyframes logo-clench { 0%, 100% { transform: scale(1); } 50% { transform: scale(.78); } }
@keyframes logo-spin { to { transform: rotate(1turn); } }

/* Hover card (sidebar.js #side-hover), positioned inside the frame. */
#side-hover { position: absolute; z-index: 30; left: 308px; width: 320px; display: grid; gap: 6px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); --card: var(--surface); color: var(--fg); box-shadow: 0 8px 28px rgb(0 0 0 / .28); font-size: 13px; line-height: 1.4; pointer-events: none; }
#side-hover .h { display: flex; align-items: center; gap: 10px; }
#side-hover .h > span:last-child { min-width: 0; display: grid; }
#side-hover .h .sb-logo, #side-hover .h .sb-logo > img:first-child { width: 28px; height: 28px; }
#side-hover small { color: var(--muted); font-size: 12px; }
#side-hover .badge { justify-self: start; font-size: 11px; font-weight: 600; color: var(--muted); }
#side-hover .badge.running { color: var(--accent); } #side-hover .badge.waiting { color: var(--amber); } #side-hover .badge.compacting { color: var(--purple); }
#side-hover .q { color: var(--amber); font-weight: 600; }
#side-hover .sb-agents { padding: 0; }
#side-hover .agent small { font-size: 11px; }
#side-hover :is(p, small):empty, #side-hover .sb-agents:empty { display: none; }

/* The work column: a stub of the pane the selection opens. */
.work { display: grid; grid-template-rows: var(--bar) minmax(0, 1fr); min-width: 0; min-height: 0; }
.wk-head { display: flex; align-items: center; gap: 4px; padding: 0 16px 0 10px; border-bottom: 1px solid var(--line); }
.wk-head .tab { min-height: 32px !important; padding: 0 12px; font-size: 13px; font-weight: 600; color: var(--muted); }
.wk-head .tab.on { color: var(--fg); background: var(--raised); }
.wk-head .ttl { margin-left: auto; text-align: right; min-width: 0; }
.wk-head .ttl b { font-size: 14px; font-weight: 600; }
.wk-head .ttl small { display: block; font-size: 12px; color: var(--muted); line-height: 1.2; }
.wk-body { overflow: hidden; }
.wk-body section { padding: 20px 28px; border-bottom: 1px solid var(--line); max-width: 760px; }
.wk-body .sec { color: var(--muted); font-size: 12px; display: flex; justify-content: space-between; }
.wk-body .status { margin: 8px 0 4px; font-size: 19px; line-height: 1.45; font-weight: 550; }
.wk-body .q { background: var(--amber-bg); }
.wk-body .q h2 { margin: 6px 0 12px; font-size: 17px; }
.wk-body .q button { display: block; width: 100%; min-height: 44px; margin-top: 8px; padding: 0 14px; text-align: left; border: 1px solid var(--line); background: var(--surface); }
.wk-body .agent { min-height: 30px; font-size: 14px; gap: 10px; }
.wk-body .agent svg { width: 15px; height: 15px; }
.wk-body .agent small { font-size: 12px; }
.wk-empty { margin: 40px 28px; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<header class="mk-top">
  <h1>Expand models <small>· mock</small></h1>
  <nav class="mk-tabs" id="tabs" aria-label="Expand model"></nav>
</header>
<div class="mk-main">
  <div class="mk-stage" id="stage"><div class="mk-holder" id="holder">

function visible() {
  const test = FILTERS.find((f) => f[0] === S.filter)[2], q = S.q.toLowerCase();

}

  list.unshift({ id: "need", label: "Needs you", panes: panes.filter((p) => p.state === "need"), alert: true });

    model: "Sub-agents never unfold in the list. Each row carries a strip: one dot per sub-agent (filled running, purple compacting, hollow finished) and a count. The names live in the hover card (350 ms) and in the pane's overview when selected. Density is unchanged.",
    controls: ["⇕ and group icons: rows vs cards, as shipped.", "Hover a row: the card lists every sub-agent with elapsed and tokens.", "Click: the overview (right) lists them."],
    trade: [["Discoverable", "Hover is invisible until tried, but the dots invite it."], ["See everything", "Not at once: one hover or one click per pane."], ["Vertical cost", "Zero. The list stays as dense as today."], ["Consistency", "One expand control. The confusion is fixed by deleting the second one."]],
    only: "not inline. Hover a row (or select it) to see its sub-agents.",
    tryIt: "Hover a few Working rows. Flip “Finished sub-agents” to see hollow dots." },
  E5: { title: "E5 · The selected pane expands",
    model: "Only the selected pane unfolds its sub-agents inline, accordion-style: select another and the first folds. Everything else stays compact and shows a count. One global density toggle; no per-group or per-row expanders.",
    controls: ["⇕ (bar): rows vs cards everywhere (Needs you stays cards).", "Click a pane: it opens and its sub-agents unfold in the list.", "Option below: also unfold on hover."],
    trade: [["Discoverable", "Implicit: it happens when you click, nothing to learn, nothing to find."], ["See everything", "Never all at once: one pane at a time."], ["Vertical cost", "Near zero: one pane's worth."], ["Consistency", "Simplest, but the list shifts when selection moves. Turn on hover to feel why that's usually bad."]],
    extra: () => `<label class="mk-check"><input type="checkbox" data-act="e5hover" ${O.E5.hoverOpen ? "checked" : ""}> Also unfold the hovered pane (after 350 ms)</label>`,
    only: "one pane at a time: click it. Never all at once.",
    tryIt: "Click down the Working group. Then turn on hover-unfold and sweep the mouse down the list." },
  E6: { title: "E6 · Panes | Agents view",
    model: "A view switch replaces the expand question. <b>Panes</b> is today's sidebar with a count. <b>Agents</b> lists every sub-agent under its parent pane, keeping the same State / Session groups, and answers “what is all my parallel work doing?”. Panes without sub-agents drop out.",
    controls: ["View: Panes / Agents (counts on both).", "Panes: ⇕ and group icons, as shipped.", "Agents: no density; folds and filters still apply."],
    trade: [["Discoverable", "High. A labelled switch at the top."], ["See everything", "1 click: Agents."], ["Vertical cost", "Every sub-agent line, but idle panes leave, so it's shorter than E1 Full."], ["Consistency", "Two views, one job each. You lose sub-agents beside the other panes in one list."]],
    only: "View → Agents. 1 click, but panes without sub-agents leave the list.",
    tryIt: "Switch to Agents, group by Session, filter to Needs you." },
};
CAP.E7 = { title: "E7 · Sub-agents switch",
  only: "the Sub-agents switch, with rows (the default density). On by default, so 0 clicks; your choice is remembered.",
  model: "Density stays exactly as shipped: rows or cards, which is about the <b>description</b>. Sub-agents get <b>one labelled switch</b> at the top of the list that shows every pane's sub-agents under its row, in whatever density you're in. Rows + switch on = sub-agents only.",
  controls: ["<b>Sub-agents</b> switch (top of the list): every pane, every group, on or off. Remembered across reloads.", "⇕ and group icons: rows vs cards, as shipped.", "No per-row toggles. A robot count shows while the switch is off."],
  trade: [["Discoverable", "High. A labelled switch with a count, first thing in the list."], ["See everything", "0 clicks (on by default), or 1."], ["Vertical cost", "Every running sub-agent is a line: about 2.7 screens at 1440×900 in rows (see Live measure); ⇕ adds descriptions on top."], ["Consistency", "Two controls, two nouns: density = description, switch = sub-agents. Neither changes what the other does. The Group-by row is full at 300px, so the switch gets its own row."]],
  tryIt: "Flip the switch off and on. Then flip ⇕ to cards: sub-agents stay, descriptions join them." };
CAP.E8 = { title: "E8 · E1 reordered",
  only: "Show → Agents. 1 click from the default.",
  model: "E1's single density control, reordered so the common case is the middle step: <b>Compact</b> (one line) → <b>Agents</b> (one line + sub-agents, no description) → <b>Full</b> (description + sub-agents). Rows have no toggles.",
  controls: ["<b>Show</b> Compact / Agents / Full: sets every group.", "Group header icon: cycles that group through the three steps.", "Needs you starts at Full so its answer buttons show."],
  trade: [["Discoverable", "High. One labelled control, and “Agents” says what it does."], ["See everything", "1 click: Agents, or Full for descriptions too."], ["Vertical cost", "Agents is the same as E7 with rows."], ["Consistency", "One axis, but it's no longer “more”: you can't have descriptions without sub-agents (E1's Detail is gone). Show → Agents also turns Needs you into rows, which hides its answer buttons until its group icon goes back to Full."]],
  tryIt: "Click Agents. Cycle the Working group's icon. Compare with E7." };
function caption() {
  const c = CAP[S.opt];
  $("only").innerHTML = `<b>Sub-agents only, no descriptions:</b> ${c.only}`;
  $("caption").innerHTML = `<h3>Model</h3><h2>${c.title}</h2><p>${c.model}</p>${c.extra ? c.extra() : ""}<h3>Controls</h3><ul>${c.controls.map((x) => `<li>${x}</li>`).join("")}</ul><h3>Tradeoffs</h3><table class="mk-trade">${c.trade.map(([k, v]) => `<tr><th>${k}</th><td>${v}</td></tr>`).join("")}</table><h3>Try</h3><p>${c.tryIt}</p>`;
}
function metric() {
  const list = $("side-list"), lines = list.querySelectorAll(".sb-agents .agent").length, total = PANES.reduce((s, p) => s + subsOf(p).length, 0);
  $("metric").innerHTML = `<span>List height <b>${list.scrollHeight.toLocaleString()} px</b> in a <b>${list.clientHeight} px</b> viewport — <b>${(list.scrollHeight / list.clientHeight).toFixed(1)}×</b> screens</span><span>Sub-agent lines inline: <b>${lines}</b> of <b>${total}</b> ${S.finished ? "" : "running "}sub-agents</span><span>${PANES.length} panes · ${PANES.filter((p) => p.subs.length).length} with sub-agents</span>`;
}

// ── Frame sizing ──
function layout() {
  const [w, h] = S.frame === "1920" ? [1920, 1080] : [1440, 900];
  const frame = $("frame"), stage = $("stage"), holder = $("holder");
  stage.classList.toggle("actual", S.zoom === "actual");
  const scale = S.zoom === "actual" ? 1 : Math.min(1, (stage.clientHeight - 28) / h);
  Object.assign(frame.style, { width: `${w}px`, height: `${h}px`, transform: `scale(${scale})` });
  Object.assign(holder.style, { width: `${w * scale}px`, height: `${h * scale}px` });
  frame._scale = scale;
  metric();
}
addEventListener("resize", layout);

// ── Interaction ──
function act(el) {
  const a = el.dataset.act, v = el.dataset.v, g = el.dataset.g, id = el.dataset.p, o = O[S.opt];
  const groupPanes = (gid) => groups(visible()).find((x) => x.id === gid)?.panes || [];
  switch (a) {
    case "sel": S.selected = id; break;
    case "fold": S.fold[g] = !S.fold[g]; break;
    case "by": S.by = v; break;
    case "all": o.all = v === "true"; o.cards = {}; break;
    case "cards": { const gr = groups(visible()).find((x) => x.id === g); o.cards[g] = !cardsOf(o, gr); break; }
    case "lvlall": o.all = +v; o.lvl = {}; break;
    case "lvlgrp": { const gr = groups(visible()).find((x) => x.id === g); o.lvl[g] = (lvlOf(S.opt, gr) + 1) % 3; break; }
    case "e7sw": O.E7.on = !O.E7.on; break;
    case "e2all": O.E2.all = v === "true"; O.E2.cards = {}; O.E2.ov = {}; break;
    case "e2grp": { const gr = groups(visible()).find((x) => x.id === g); O.E2.cards[g] = !cardsOf(O.E2, gr); groupPanes(g).forEach((p) => delete O.E2.ov[p.id]); break; }
    case "e2row": { const p = PANES.find((x) => x.id === id), gr = groups(visible()).find((x) => x.panes.includes(p)); const open = O.E2.ov[id] ?? cardsOf(O.E2, gr); if (!open === cardsOf(O.E2, gr)) delete O.E2.ov[id]; else O.E2.ov[id] = !open; break; }
    case "e3tree": O.E3.tree = v === "true"; O.E3.open = {}; break;
    case "e3row": O.E3.open[id] = !treeOpen(PANES.find((x) => x.id === id)); break;
    case "e5all": O.E5.cards = !O.E5.cards; break;
    case "e6view": O.E6.view = v; break;
    case "answer": { const p = PANES.find((x) => x.id === id); Object.assign(p, { state: "run", age: "now", activity: `Answer sent: ${v}. Continuing.`, question: "" }); break; }
    default: return;
  }
  unhover(); render();
}
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act], [data-opt]");
  if (!t || t.matches("select, input")) return;
  if (t.dataset.opt) { S.opt = t.dataset.opt; history.replaceState(null, "", `${location.search}#${S.opt}`); S.hover = null; unhover(); render(); $("side-list").scrollTop = 0; return; }
  act(t);
});
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.dataset.act === "filter") { S.filter = t.value; render(); }
  if (t.dataset.act === "e1sel") { O.E1.sel = t.checked; render(); }
  if (t.dataset.act === "e5hover") { O.E5.hoverOpen = t.checked; render(); }
});
$("search").addEventListener("input", (e) => { S.q = e.target.value; render(); });
for (const [id, key] of [["set-frame", "frame"], ["set-zoom", "zoom"], ["set-theme", "theme"]])
  $(id).addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) { S[key] = b.dataset.v; render(); } });
$("set-done").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) { S.finished = b.dataset.v === "show"; render(); } });
$("theme-btn").addEventListener("click", () => { S.theme = S.theme === "light" ? "dark" : "light"; render(); });
$("reset").addEventListener("click", () => { O[S.opt] = initial()[S.opt]; Object.assign(S, { by: "state", filter: "all", q: "", fold: {} }); $("search").value = ""; PANES = fresh(); render(); });
$("collapse-btn").innerHTML = licon("panel", 20);
$("new-window").innerHTML = `${licon("plus", 20)}New window`;
$("dash-btn").innerHTML = licon("dashboard", 20);
$("bell-btn").innerHTML = licon("bell", 20);
$("search-icon").innerHTML = licon("search", 18);

// Hover card: 350 ms like sidebar.js; tracked by pane id so re-renders don't lose it.
let timer = 0;
function unhover() { clearTimeout(timer); $("side-hover").hidden = true; if (S.hover && S.opt === "E5" && O.E5.hoverOpen) { S.hover = null; renderList(); metric(); } S.hover = null; }
function place(id) {
  const node = $("side-list").querySelector(`[data-p="${CSS.escape(id)}"].sb-row, [data-p="${CSS.escape(id)}"].sb-card`);
  if (!node) return;
  const card = $("side-hover"), f = $("frame").getBoundingClientRect(), s = $("frame")._scale, r = node.getBoundingClientRect();
  const top = (r.top - f.top) / s, bottom = (r.bottom - f.top) / s, h = card.offsetHeight, H = $("frame").offsetHeight;
  card.style.top = `${Math.max(8, top + h > H - 8 ? bottom - h : top)}px`;
}
$("side-list").addEventListener("pointerover", (e) => {
  const node = e.target.closest(".sb-row, .sb-card");
  if (!node || e.pointerType !== "mouse" || node.dataset.p === S.hover) return;
  clearTimeout(timer);
  const id = node.dataset.p;
  timer = setTimeout(() => {
    S.hover = id;
    if (S.opt === "E5" && O.E5.hoverOpen) { renderList(); metric(); }
    fillHover(PANES.find((x) => x.id === id)); $("side-hover").hidden = false; place(id);
  }, 350);
});
$("side-list").addEventListener("pointerleave", unhover);
$("side-list").addEventListener("pointerout", (e) => {
  const from = e.target.closest(".sb-row, .sb-card"), to = e.relatedTarget?.closest?.(".sb-row, .sb-card");
  if (from && from.dataset.p !== to?.dataset.p) unhover();
});
$("side-list").addEventListener("scroll", () => { if (S.hover) { $("side-hover").hidden = true; } }, { passive: true });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") unhover(); });

addEventListener("hashchange", () => { fromHash(); unhover(); render(); });
S.opt = String(S.opt).toUpperCase(); if (!OPTS[S.opt]) S.opt = "E1"; // a stale or hand-typed ?opt= would blank the page
fromHash();
render();
</script>
</body>
</html>
