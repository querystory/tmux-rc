<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fleet Layout Studies</title>
<style>
/* Layout concept: a sticky comparison toolbar over a gallery of full-page tmux-rc mockups, scaled to fit, with a click-to-expand annotated view.
   Tokens are the real tmux-rc :root tokens (web/m/style.css) plus mock-only chart tokens. */
:root{
  --bg:#f5f7f6;--surface:#fff;--raised:#e7ede9;--line:#ccd7d0;--fg:#1b2821;--muted:#53655b;--accent:#146b46;--accent-bg:#dcf4e7;--lift:#fff;
  --amber:#815600;--amber-bg:#fff2d4;--red:#b52c36;--purple:#8250df;
  --stage:#dde4e0;--s-run:#22a063;--s-need:#c98200;--s-idle:#c3cec7;--gap:#dfe5e1;--shadow:0 8px 28px rgb(20 40 30 / .18);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101312;--surface:#191d1b;--raised:#252b28;--line:#343d38;--fg:#edf2ef;--muted:#a1ada6;--accent:#83ddb3;--accent-bg:#193c2c;--lift:#2b322f;
  --amber:#f1c56a;--amber-bg:#352d1c;--red:#ff9696;--purple:#a371f7;
  --stage:#0a0c0b;--s-run:#60c992;--s-need:#f1bd53;--s-idle:#4a5560;--gap:#262c29;--shadow:0 8px 28px rgb(0 0 0 / .5);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101312;--surface:#191d1b;--raised:#252b28;--line:#343d38;--fg:#edf2ef;--muted:#a1ada6;--accent:#83ddb3;--accent-bg:#193c2c;--lift:#2b322f;
  --amber:#f1c56a;--amber-bg:#352d1c;--red:#ff9696;--purple:#a371f7;
  --stage:#0a0c0b;--s-run:#60c992;--s-need:#f1bd53;--s-idle:#4a5560;--gap:#262c29;--shadow:0 8px 28px rgb(0 0 0 / .5);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--stage);color:var(--fg);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;border-radius:6px}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{flex:none;vertical-align:middle}
/* ---------- page chrome ---------- */
#bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center}
#bar h1{font-size:16px;margin:0;font-weight:650;margin-right:auto;white-space:nowrap}
.ctl{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.seg{display:inline-flex;background:var(--raised);border-radius:8px;padding:2px;gap:2px}
.seg button{padding:4px 11px;min-height:28px;font-size:13px;color:var(--muted);border-radius:6px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0 / .18);font-weight:600}
main{padding:20px 16px 48px;max-width:1800px;margin:0 auto}
.intro{max-width:78ch;color:var(--muted);margin:0 0 20px}
.intro b{color:var(--fg)}
.grp-h{display:flex;align-items:baseline;gap:12px;margin:26px 0 12px;flex-wrap:wrap}
.grp-h h2{margin:0;font-size:15px;font-weight:650}
.grp-h span{color:var(--muted);font-size:13px;max-width:110ch}.grp-h span b{color:var(--fg)}
.grid{display:grid;gap:28px 22px;grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr))}
.grid.phg{grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;min-width:0;text-align:left;padding:0}
.card:hover{border-color:var(--accent)}
.card .stage{border-bottom:1px solid var(--line)}
.cap{padding:10px 14px 12px;display:grid;gap:3px}
.cap b{font-size:14px}
.cap p{margin:0;color:var(--muted);font-size:12.5px}
.tag{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:6px;background:var(--accent-bg);color:var(--accent);font-weight:700;font-size:12px;margin-right:8px}
.stage{position:relative;overflow:hidden;background:var(--bg)}
.stage.act{overflow:auto}
.stage .scaler{transform-origin:0 0;position:absolute;left:0;top:0}
.ov .stage{pointer-events:none}
.xv{display:grid;gap:18px 26px;grid-template-columns:minmax(0,1fr) 340px;align-items:start}
@media (max-width:1000px){.xv{grid-template-columns:minmax(0,1fr)}}
.xstage{border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);max-width:100%;width:100%}
.xstage.phone{margin:0 auto}
.note{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;position:sticky;top:76px;min-width:0}
.note h2{margin:0;font-size:18px;line-height:1.25}
.note h3{margin:0 0 2px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.note p{margin:0;font-size:13.5px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;align-items:center}
.tabs button{min-width:34px;height:30px;padding:0 9px;border:1px solid var(--line);background:var(--surface);font-weight:650;font-size:13px}
.tabs button[aria-current="true"]{background:var(--accent-bg);color:var(--accent);border-color:var(--accent)}
.tbtn{border:1px solid var(--line);background:var(--surface);padding:5px 12px;font-size:13px}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:760px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase}
tr:last-child td{border-bottom:0}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--fg);color:var(--bg);padding:6px 9px;border-radius:7px;font-size:12px;line-height:1.4;white-space:nowrap;transform:translate(-50%,-100%);display:none;box-shadow:0 4px 14px rgb(0 0 0 / .3)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:9px;font-size:13px;z-index:60;display:none}
.foot{color:var(--muted);font-size:12px;margin-top:22px;max-width:90ch}
/* ---------- frames: a native-looking tmux-rc ---------- */
.fr{--term:#0e1210;width:var(--fw,1440px);height:var(--fh,900px);container:fr/size;background:var(--bg);color:var(--fg);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;position:relative;overflow:hidden;display:flex;text-align:left}
.fr.phone{width:var(--fw,390px);height:var(--fh,844px);flex-direction:column;font-size:15px}
.fr h1,.fr h2,.fr p{margin:0}
.fr button{min-height:0}
.fr button:not(:disabled):hover{background:var(--raised)}
.fr .col{flex:1;min-width:0;display:flex;flex-direction:column}
.fr .body{flex:1;min-height:0;display:grid;grid-template-columns:340px minmax(0,1fr)}
.hd{height:56px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line);flex:none;position:relative;background:var(--bg)}
.hc{flex:1;min-width:0;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:14px}
.hr{display:flex;align-items:center;gap:2px;flex:none}
.brand{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:650;white-space:nowrap;position:relative}
.logomark{width:28px;height:28px;border-radius:7px;background:var(--fg);display:grid;place-items:center;position:relative;color:var(--accent)}
.livedot{position:absolute;right:-3px;bottom:-3px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
.live{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-right:6px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.ib{width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--fg);position:relative}
.ib.sm{width:28px;height:28px}
.ib.acc{background:var(--accent-bg);color:var(--accent)}
.ib.on{background:var(--accent-bg);color:var(--accent)}
.ib .bd{position:absolute;top:3px;right:2px;min-width:16px;height:16px;border-radius:8px;background:var(--s-need);color:#1a1200;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.pill{display:inline-flex;align-items:center;gap:1px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:2px}
.vr{width:1px;height:20px;background:var(--line);margin:0 4px}
.chip{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px;border-radius:15px;border:1px solid var(--line);background:var(--surface);font-size:13px;white-space:nowrap}
.chip .d{width:8px;height:8px;border-radius:50%;background:var(--s-idle)}
.chip .d.run{background:var(--s-run)}.chip .d.need{background:var(--s-need)}
.chip b{font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--accent-bg);border-color:var(--accent);color:var(--accent);font-weight:600}
.chip.need[aria-pressed="true"]{background:var(--amber-bg);border-color:var(--s-need);color:var(--amber)}
.num{font-variant-numeric:tabular-nums}
.big{font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.mut{color:var(--muted)}
.lab{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
.spark{display:block;overflow:visible;cursor:crosshair}
.spark .cross{opacity:0}
.spark:hover .cross{opacity:.45}
.pos{color:var(--accent);font-weight:600}.neg{color:var(--amber);font-weight:600}
.goalpill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 9px;border-radius:8px;background:var(--raised);white-space:nowrap}
.fr .seg{background:var(--raised)}
.fr .seg button{padding:2px 9px;min-height:24px;font-size:12px}
/* list */
.left{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--bg);min-width:0}
.lh{display:flex;align-items:center;gap:8px;padding:14px 20px 10px}
.lh h1{font-size:24px;font-weight:650;line-height:1.2;flex:1}
.sort{font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:2px}
.search{margin:0 20px 12px;height:40px;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:0 12px;color:var(--muted);font-size:15px}
.list{flex:1;min-height:0;overflow:hidden}
.row{display:flex;gap:12px;align-items:flex-start;padding:13px 20px;border-bottom:1px solid var(--line)}
.row.need{background:var(--amber-bg)}
.row.cur{background:var(--lift);margin-inline:6px;padding-inline:14px;border-radius:10px;border-bottom-color:transparent;box-shadow:inset 4px 0 var(--fg),inset 0 0 0 1px color-mix(in srgb,var(--fg) 40%,transparent)}
.rb{flex:1;min-width:0}
.rt{display:flex;gap:8px;align-items:baseline}
.rt strong{flex:1;font-size:15px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rs{font-size:12px;color:var(--muted);white-space:nowrap}
.rs.need{color:var(--amber);font-weight:700}
.rx{color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rm{color:var(--muted);font-size:11px;margin-top:4px}
.lg{display:inline-flex;flex:none;border-radius:50%}
.lg svg{width:100%;height:100%;border-radius:7px}
.lg.working{background:var(--accent-bg);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent),0 0 0 1px var(--accent);margin:4px}
.lg.working svg{border-radius:50%}
@media (prefers-reduced-motion:no-preference){.lg.working{animation:clench 1.4s ease-in-out infinite}.lg.working[data-tool="codex"]{animation:spin 3s linear infinite}}
@keyframes clench{0%,100%{transform:scale(1)}50%{transform:scale(.8)}}
@keyframes spin{to{transform:rotate(1turn)}}
.bnav{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border-top:1px solid var(--line);background:var(--surface);padding:6px 8px;gap:4px;flex:none}
.bnav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:12px;color:var(--muted)}
.bnav button b{font-variant-numeric:tabular-nums;font-weight:600}
.bnav button[aria-pressed="true"]{background:var(--accent-bg);color:var(--accent)}
.bnav button.need[aria-pressed="true"]{background:var(--amber-bg);color:var(--amber)}
/* detail */
.detail{display:flex;flex-direction:column;min-width:0;min-height:0}
.ph{height:56px;flex:none;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--bg)}
.ph div{flex:1;min-width:0}.ph strong{display:block;font-size:14px}.ph small{display:block;font-size:12px;color:var(--muted)}
.lay{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.sel{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 8px;color:var(--fg);font-size:13px}
.dgrid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 400px}
.tcol{display:flex;flex-direction:column;min-width:0;min-height:0}
.tb{height:40px;flex:none;display:flex;align-items:center;gap:6px;padding:0 10px 0 16px;background:var(--term);color:#aab8b0;font-size:12px;border-bottom:1px solid #222a26}
.tb strong{color:#e5eee8;font-weight:600}
.tb .sp{flex:1}
.tb .ib{color:#c3d0c8}.tb button:hover{background:#242b27!important}
.tb .seg{background:#1b221e}.tb .seg button{color:#93a39a}.tb .seg button[aria-pressed="true"]{background:#2d3732;color:#e5eee8;box-shadow:none}
.selbtn{padding:0 6px}
.term{flex:1;min-height:0;background:var(--term);color:#cfe0d6;font:12.5px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:10px 0;overflow:hidden;white-space:pre}
.term div{padding:0 16px}
.term .add{background:#1c5a2f;color:#e6f6ea;margin-right:140px}
.term .dim{color:#7d8d84}
.ovc{border-left:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.ovb{padding:16px 18px;display:grid;gap:12px;align-content:start}
.ovb .badge{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.ovb h2{font-size:17px;line-height:1.35}
.ovb h3{font-size:13px;margin:0 0 6px;font-weight:650}
.ovb p{color:var(--muted);font-size:13px}
.lk{display:flex;gap:8px;align-items:center;color:var(--accent);font-size:13px;padding:3px 0}
.tk{display:flex;gap:8px;font-size:13px;padding:3px 0;color:var(--muted)}
.tk i{width:14px;height:14px;border:1.5px solid var(--line);border-radius:4px;flex:none;margin-top:3px}
.tk.d i{background:var(--accent);border-color:var(--accent)}
.ev{display:flex;gap:10px;font-size:12.5px;color:var(--muted);padding:3px 0}.ev time{width:44px;flex:none;font-variant-numeric:tabular-nums}
.card2{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px}
/* strips, status bar, rail, popovers */
.strip{flex:none;display:flex;align-items:center;gap:20px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--surface)}
.sbar{height:30px;flex:none;display:flex;align-items:center;gap:14px;padding:0 14px;border-top:1px solid var(--line);background:var(--surface);font-size:12px;color:var(--muted)}
.sbar .sp{flex:1}
.sbar b{color:var(--fg);font-variant-numeric:tabular-nums}
.rail{width:72px;flex:none;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:4px}
.rail button{width:60px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;font-size:10.5px;color:var(--muted);position:relative}
.rail button[aria-pressed="true"]{background:var(--accent-bg);color:var(--accent)}
.rail button.need[aria-pressed="true"]{background:var(--amber-bg);color:var(--amber)}
.rail .bd{position:absolute;top:2px;right:6px;min-width:16px;height:16px;border-radius:8px;background:var(--s-need);color:#1a1200;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.rail .bd.run{background:var(--s-run);color:#04140b}
.rail .sp{flex:1}
.pop{position:absolute;z-index:10;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:14px;display:grid;gap:10px;font-size:13px}
.pop .r{display:flex;align-items:center;justify-content:space-between;gap:16px}
.pop .r span:first-child{display:flex;align-items:center;gap:8px}
.tog{width:34px;height:20px;border-radius:10px;background:var(--accent);position:relative;display:inline-block}
.tog::after{content:"";position:absolute;right:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff}
.tog.off{background:var(--raised)}.tog.off::after{right:auto;left:2px}
.cmd{display:flex;align-items:center;gap:10px;height:38px;width:520px;max-width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 12px;color:var(--muted);font-size:14px}
.cmd kbd{margin-left:auto;font:11px ui-monospace,monospace;border:1px solid var(--line);border-radius:5px;padding:1px 6px;background:var(--raised)}
.dock{display:flex;gap:6px;align-items:center}
.dock .lg{position:relative}
.dock .nd::after{content:"";position:absolute;right:-3px;top:-3px;width:10px;height:10px;border-radius:50%;background:var(--s-need);border:2px solid var(--bg)}
.dock .idl{opacity:.55}
/* phone */
.phone .hd{height:56px;padding:0 8px 0 16px;gap:4px}
.phone .ib{width:40px;height:40px}
.phone .lh{padding:12px 16px 8px}
.phone .lh h1{font-size:26px}
.phone .search{margin:0 16px 10px;height:44px}
.phone .row{padding:13px 16px}
.phone .bnav{padding:6px 8px 14px}
.phone .bnav button{padding:7px 2px;gap:3px}
.sheet{position:absolute;left:0;right:0;top:56px;z-index:10;background:var(--surface);border-radius:0 0 18px 18px;border-bottom:1px solid var(--line);box-shadow:var(--shadow);padding:14px 16px 10px;display:grid;gap:12px}
.scrim{position:absolute;inset:56px 0 0;background:rgb(0 0 0 / .38);z-index:9}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:2px auto 0}
.cardrow{margin:0 16px 10px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:12px}
.chiprow{display:flex;gap:6px;padding:0 16px 10px;overflow:hidden}
.viewtog{display:flex;padding:8px 16px;gap:8px;border-bottom:1px solid var(--line)}
/* ---------- round 2: one chatbot-style sidebar ---------- */
.sb{width:280px;flex:none;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0;font-size:13px}
.sb.mini{width:60px;align-items:center}
.sbh{height:52px;flex:none;display:flex;align-items:center;gap:2px;padding:0 8px 0 14px;width:100%}
.sbh .brand{font-size:16px;margin-right:auto}
.sb.mini .sbh{padding:0;justify-content:center}
.nv{display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;margin:0 6px;border-radius:8px;font-size:13.5px;flex:none;width:calc(100% - 12px);position:relative}
.nv>svg{color:var(--muted)}
.nv .k{margin-left:auto;min-width:18px;height:18px;border-radius:9px;background:var(--s-need);color:#1a1200;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.nv.new,.nv.new>svg{color:var(--accent);font-weight:600}
.sb.mini .nv{width:40px;height:36px;padding:0;margin:0;justify-content:center}
.sb.mini .nv .k{position:absolute;top:0;right:-2px}
.sec{display:flex;align-items:center;gap:6px;height:30px;padding:8px 10px 0 16px;font-size:12px;color:var(--muted);font-weight:600;flex:none}
.sec .sp{flex:1}
.sec .fb{display:inline-flex;align-items:center;gap:4px;padding:2px 6px;font-size:12px;color:var(--muted);font-weight:600}
.sbl{flex:1;min-height:0;overflow:auto;scrollbar-width:thin;padding-bottom:8px;width:100%}
.th,.sg{text-align:left;display:flex;align-items:center;gap:9px;height:28px;padding:0 8px 0 10px;margin:0 6px;border-radius:7px;white-space:nowrap;width:calc(100% - 12px)}
.th .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.th .a{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.th .s2{color:var(--muted);font-size:11.5px;flex:none}

function when(i){const d=series(),t=new Date(d.end-(d.pts.length-1-i)*d.stepMs);return S.range=='7d'?t.toLocaleString([], {weekday:'short',hour:'2-digit',minute:'2-digit'}):t.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});}
function stats(){const P=series().pts.filter(Boolean),avg=P.reduce((a,p)=>a+p[1],0)/P.length;
 const pct=Math.round(100*P.filter(p=>p[1]>=S.goal).length/P.length);
 const w=DATA['7d'].pts.filter(Boolean),a=w.slice(-24),b=w.slice(-48,-24),m=x=>x.reduce((s,p)=>s+p[1],0)/x.length;
 return{avg:avg.toFixed(1),pct,peak:Math.max(...P.map(p=>p[1])),delta:(m(a)-m(b)),obs:Math.round(100*P.length/series().pts.length)};}
/* ---------- the sparkline: hand-drawn SVG ---------- */
function spark(o){
 const d=series(),P=d.pts,n=P.length,w=o.w,h=o.h,ax=!!o.axis,L=ax?30:0,B=ax?18:0,T=ax?8:3,R=ax?6:0,bot=h-B-(ax?0:3),pw=w-L-R,bw=pw/n;
 const stack=o.mode!='area',tot=p=>p[0]+p[1]+(o.idle&&ax?p[2]:0);
 let mx=Math.max(...P.filter(Boolean).map(stack?tot:p=>p[1]),o.target||0,3);mx=ax?Math.ceil(mx/2)*2:mx*1.12;
 const y=v=>bot-v/mx*(bot-T),xc=i=>L+bw*(i+.5);let g='';
 if(ax){for(const v of [0,mx/2,mx])g+=`<line x1="${L}" x2="${w-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+3.5}" text-anchor="end" font-size="10" fill="var(--muted)">${v}</text>`;
  for(const f of [0,.33,.66,1]){const i=Math.round(f*(n-1));g+=`<text x="${xc(i)}" y="${h-4}" text-anchor="${f==0?'start':f==1?'end':'middle'}" font-size="10" fill="var(--muted)">${when(i)}</text>`;}}
 P.forEach((p,i)=>{if(!p)g+=`<rect x="${L+i*bw}" y="${T}" width="${Math.max(bw,1)}" height="${bot-T}" fill="var(--gap)"/>`;});
 if(stack){const gp=bw>4?1.4:0;P.forEach((p,i)=>{if(!p)return;let b=bot;const x=L+i*bw+gp/2,ww=Math.max(bw-gp,1);
  const seg=(v,c,op)=>{if(!v)return;const hh=v/mx*(bot-T);b-=hh;g+=`<rect x="${x.toFixed(2)}" y="${b.toFixed(2)}" width="${ww.toFixed(2)}" height="${Math.max(hh-(b<bot-hh?0:0)-.6,1).toFixed(2)}" rx="1" fill="${c}" opacity="${op}"/>`;};
  seg(p[1],'var(--s-run)',o.target&&p[1]<o.target?.45:1);seg(p[0],'var(--s-need)',1);if(o.idle&&ax)seg(p[2],'var(--s-idle)',.7);});}
 else{let seg=[];const flush=()=>{if(!seg.length)return;const pts=seg.map(i=>`${xc(i).toFixed(1)},${y(P[i][1]).toFixed(1)}`);
   g+=`<path d="M${xc(seg[0]).toFixed(1)},${bot} L${pts.join(' L')} L${xc(seg[seg.length-1]).toFixed(1)},${bot}Z" fill="var(--s-run)" opacity=".2"/><polyline points="${pts.join(' ')}" fill="none" stroke="var(--s-run)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;seg=[];};
  P.forEach((p,i)=>{if(p)seg.push(i);else flush();});flush();
  P.forEach((p,i)=>{if(p&&p[0])g+=`<rect x="${(xc(i)-Math.max(bw/2,1)).toFixed(1)}" y="${bot-3}" width="${Math.max(bw,2).toFixed(1)}" height="3" fill="var(--s-need)"/>`;});
  const li=n-1;g+=`<circle cx="${xc(li)}" cy="${y(P[li][1])}" r="3.5" fill="var(--s-run)" stroke="var(--bg)" stroke-width="2"/>`;}
 if(o.target)g+=`<line x1="${L}" x2="${w-R}" y1="${y(o.target)}" y2="${y(o.target)}" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="4 3"/>`+(o.tlabel?`<text x="${w-R}" y="${y(o.target)-4}" text-anchor="end" font-size="10" fill="var(--muted)" stroke="var(--bg)" stroke-width="3" paint-order="stroke">goal ${o.target}</text>`:'');
 g+=`<line class="cross" x1="0" x2="0" y1="${T}" y2="${bot}" stroke="var(--fg)" stroke-width="1"/>`;
 const cur=P[n-1];
 return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" data-L="${L}" data-bw="${bw}" data-w="${w}" data-act="${o.act||''}" role="img" aria-label="Agents by state over the last ${S.range}: now ${cur[1]} running, ${cur[0]} needs you">${g}</svg>`;}

function fit(){document.querySelectorAll('.stage').forEach(st=>{const w=+st.dataset.w,h=+st.dataset.h,fx=st.classList.contains('fx'),a=st.classList.contains('act'),xs=st.parentElement;
 if(fx)xs.style.width='';const room=fx?xs.clientWidth:st.clientWidth;
 const sc=rz?rz.sc:a?1:Math.min(1,room/w,fx?(innerHeight-170)/h:1),sl=st.firstElementChild;st.dataset.sc=sc;
 sl.style.transform=`scale(${sc})`;sl.style.width=w+'px';sl.style.height=h+'px';
 if(fx){xs.style.width=Math.min(w*sc,room)+2+'px';st.style.height=Math.min(h*sc,a?innerHeight-170:1e5)+'px';}else st.style.height=h*sc+'px';});}
function render(){
 document.documentElement.dataset.theme=S.theme;
 for(const[id,k]of[['c-theme','theme'],['c-frame','frame'],['c-range','range'],['c-goal','goal']])document.querySelectorAll('#'+id+' button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.act.split(':')[1]==String(S[k]))));
 if(S.open&&!inFrame().some(v=>v.id==S.open))S.open=null;
 $('#app').innerHTML=S.open?expanded():overview();S.fresh=null;fit();
 try{history.replaceState(null,'',S.open?'#'+S.open:location.pathname+location.search);}catch(e){}}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',1800);}
function act(a){const[k,...r]=a.split(':'),v=r.join(':');
 if(k=='toast')return toast(v);
 if(k=='t')S.theme=v;else if(k=='fr'){S.frame=v;S.dev=null;if(S.open&&!inFrame().some(x=>x.id==S.open))S.open=null;}else if(k=='r')S.range=v;else if(k=='g')S.goal=+v;
 else if(k=='f')S.filter=S.filter==v?'all':v;else if(k=='toggle'){S.pop[v]=!on(v);S.fresh=v;}else if(k=='idle')S.idle=!S.idle;
 else if(k=='r2'){S.range2=v;S.zoom=null;}else if(k=='ma')S.ma=v;else if(k=='g2')S.goal2=Math.max(1,Math.min(45,S.goal2+ +v));else if(k=='f2')S.f2=S.f2==v?'all':v;
 else if(k=='zoom'){const z=S.zoom||[0,1],b=S.brush;S.zoom=b.map(f=>z[0]+f*(z[1]-z[0]));S.brush=null;}else if(k=='unzoom')S.zoom=null;else if(k=='dev')S.dev=v?v.split('x').map(Number):null;
 else if(k=='open'){if(S.open==null)S.dev=null;S.open=v;scrollTo(0,0);}else if(k=='close')S.open=null;else if(k=='view')S.actual=v=='100';
 else if(k=='set'||k=='sz'){const j=v.lastIndexOf(':'),key=v.slice(0,j),x=v.slice(j+1);if(k=='sz')S.sz[key]=+x;else S.pop[key]=x=='1';}
 else if(k=='dnall'){const[id,x]=v.split(':');for(const g of ['need','run','done','idle',...SESS2])S.pop[`dn:${id}:${g}`]=x=='1';}
 else if(k=='fly'){S.pop.r3f=!(on('r3f')&&S.flyk==v);S.flyk=v;}else if(k=='dby')S.dby=v;
 render();}
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(a)return act(a.dataset.act);const c=e.target.closest('[data-open]');if(c)act('open:'+c.dataset.open);});
document.addEventListener('keydown',e=>{if(e.target.dataset&&e.target.dataset.open&&(e.key=='Enter'||e.key==' ')){e.preventDefault();act('open:'+e.target.dataset.open);}
 if(!S.open||/INPUT|SELECT/.test(e.target.tagName))return;const vs=inFrame(),i=vs.findIndex(v=>v.id==S.open);
 if(e.key=='ArrowRight')act('open:'+vs[(i+1)%vs.length].id);else if(e.key=='ArrowLeft')act('open:'+vs[(i+vs.length-1)%vs.length].id);else if(e.key=='Escape')act(vs[i].esc&&on(vs[i].esc)?'toggle:'+vs[i].esc:'close');});
document.addEventListener('change',e=>{if('goal' in e.target.dataset){S.goal2=Math.max(1,Math.min(45,Math.round(+e.target.value)||S.goal2));render();}});
/* brush: drag across a round-2 chart to select a window; resize: drag the focus frame's corner */
let brush=null,rz=null,sp=null,raf=0;
const sz=(k,d)=>k in S.sz?S.sz[k]:d,snaps=h=>h.dataset.snaps.split(',').map(Number);
const frac=(s,e)=>{const r=s.getBoundingClientRect(),k=r.width/+s.dataset.w,L=+s.dataset.L,pw=+s.dataset.w-L-+s.dataset.R;return Math.max(0,Math.min(1,((e.clientX-r.left)/k-L)/pw));};
document.addEventListener('pointerdown',e=>{const s=e.target.closest('.spark[data-brush]'),h=e.target.closest('.rz');
 if(s){e.preventDefault();brush={s,a:frac(s,e)};}
 const hs=e.target.closest('[data-split]');if(hs){e.preventDefault();sp={k:hs.dataset.split,y:e.clientY,h0:+hs.dataset.h,sc:+hs.closest('.stage').dataset.sc||1,sn:snaps(hs),moved:0};}
 if(h){e.preventDefault();const st=h.parentElement.querySelector('.stage');rz={x:e.clientX,y:e.clientY,w:+st.dataset.w,h:+st.dataset.h,sc:+st.dataset.sc};h.setPointerCapture(e.pointerId);}});
document.addEventListener('pointermove',e=>{
 if(brush){const b=frac(brush.s,e),[a,c]=[Math.min(brush.a,b),Math.max(brush.a,b)],g=brush.s.querySelector('.brush'),L=+brush.s.dataset.L,pw=+brush.s.dataset.w-L-+brush.s.dataset.R,[r,e0,e1]=g.children;
  g.removeAttribute('display');r.setAttribute('x',L+a*pw);r.setAttribute('width',(c-a)*pw);e0.setAttribute('x',L+a*pw-2);e1.setAttribute('x',L+c*pw-2);}
 if(sp&&(sp.moved||Math.abs(e.clientY-sp.y)>3)){sp.moved=1;S.sz[sp.k]=Math.round(Math.max(sp.sn[0],Math.min(sp.sn[sp.sn.length-1],sp.h0-(e.clientY-sp.y)/sp.sc)));if(!raf)raf=requestAnimationFrame(()=>{raf=0;render();});}
 if(rz){S.dev=[Math.max(320,Math.round(rz.w+(e.clientX-rz.x)/rz.sc)),Math.max(480,Math.round(rz.h+(e.clientY-rz.y)/rz.sc))];if(!raf)raf=requestAnimationFrame(()=>{raf=0;render();});}});
document.addEventListener('pointerup',e=>{if(brush){const b=frac(brush.s,e),a=brush.a;brush=null;if(Math.abs(b-a)>.02){S.brush=[Math.min(a,b),Math.max(a,b)];render();}}if(rz){rz=null;render();}
 if(sp){const{k,sn,moved}=sp,h=S.sz[k];sp=null;if(moved){S.sz[k]=sn.reduce((a,b)=>Math.abs(b-h)<Math.abs(a-h)?b:a);render();}}});
document.addEventListener('pointercancel',()=>{brush=rz=sp=null;render();});
document.addEventListener('dblclick',e=>{const hs=e.target.closest('[data-split]');if(hs){const sn=snaps(hs);S.sz[hs.dataset.split]=+hs.dataset.h>sn[0]?sn[0]:sn[1];render();}});
document.addEventListener('mousemove',e=>{const s=e.target.closest&&e.target.closest('.spark'),tip=$('#tip');if(!s){tip.style.display='none';return;}
 const r2c=!!s.dataset.r2,d=r2c?(s.dataset.sub?sub2(s.dataset.sub):ser2()):series(),n=d.pts.length,r=s.getBoundingClientRect(),k=r.width/+s.dataset.w,L=+s.dataset.L,bw=+s.dataset.bw;
 const i=Math.max(0,Math.min(n-1,Math.floor(((e.clientX-r.left)/k-L)/bw))),p=d.pts[i],x=L+bw*(i+.5),c=s.querySelector('.cross');c.setAttribute('x1',x);c.setAttribute('x2',x);
 const G=r2c?S.goal2:S.goal;tip.innerHTML=`<b>${i==n-1&&(!r2c||d.live)?'Now':r2c?when2(i):when(i)}</b><br>`+(p?`Running ${p[1]} · Needs you ${p[0]} · Idle ${p[2]}${r2c?`<br>${S.ma} avg ${d.ma[i].toFixed(1)}${s.dataset.sub?'':' · goal '+G}`:p[1]>=G?'':'<br>Under goal of '+G}`:'No observation (daemon not recording)');
 tip.style.display='block';tip.style.left=Math.max(90,Math.min(innerWidth-90,e.clientX))+'px';tip.style.top=(r.top-6)+'px';});
addEventListener('resize',fit);
{const v=V.find(x=>x.id==S.open);if(v)S.frame=v.frame;else S.open=null;}
render();
