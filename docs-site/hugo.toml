# Hugo config for the tmux-rc docs site.
#
# Content lives in the repo's ../docs tree (single source of truth — no copy).
# Requires the EXTENDED Hugo build (Hextra ships SCSS).
#
# baseURL is "/" (root-relative, prefix-agnostic) on purpose: the site is served
# at /docs behind the daemon, but the daemon STRIPS the /docs prefix before the
# file lookup (like qs-app's frontend route). So the built assets reference /css,
# /js at root and work identically whether mounted at / (dev) or /docs (prod) —
# no per-environment rebuild.

baseURL = "/"
title = "tmux-rc docs"
languageCode = "en-us"

# Point Hugo at the existing docs/ instead of a content/ dir inside docs-site.
contentDir = "../docs"

# Hextra theme via Hugo Modules (pinned in go.mod).
[module]
  [[module.imports]]
    path = "github.com/imfing/hextra"

[markup]
  [markup.goldmark.renderer]
    unsafe = true            # some design docs embed raw HTML
  [markup.highlight]
    noClasses = false        # emit CSS classes so the theme controls code colors

[params]
  [params.navbar]
    displayTitle = true
    displayLogo = false      # logo wired in during the styling phase

  [params.footer]
    displayCopyright = false
    displayPoweredBy = false

  # Client-side search. Hextra's flexsearch is built-in and needs no post-build
  # step; Pagefind (per the plan) can replace this in the build phase if preferred.
  [params.search]
    enable = true
    type = "flexsearch"
