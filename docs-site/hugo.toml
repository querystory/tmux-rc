# Hugo config for the termiphone docs site.
#
# Content lives in the repo's ../docs tree (single source of truth — no copy). The
# site is served at /docs behind the daemon, so baseURL carries that path prefix.
# Requires the EXTENDED Hugo build (Hextra ships SCSS).

baseURL = "/docs/"
title = "termiphone docs"
languageCode = "en-us"

# Point Hugo at the existing docs/ instead of a content/ dir inside docs-site.
contentDir = "../docs"

# Hextra theme via Hugo Modules (pinned in go.mod).
[module]
  [[module.imports]]
    path = "github.com/imfing/hextra"

[markup]
  [markup.goldmark.renderer]
    unsafe = true            # some design docs embed raw HTML
  [markup.highlight]
    noClasses = false        # emit CSS classes so the theme controls code colors

[params]
  [params.navbar]
    displayTitle = true
    displayLogo = false      # logo wired in during the styling phase

  [params.footer]
    displayCopyright = false
    displayPoweredBy = false

  # Client-side search. Hextra's flexsearch is built-in and needs no post-build
  # step; Pagefind (per the plan) can replace this in the build phase if preferred.
  [params.search]
    enable = true
    type = "flexsearch"
