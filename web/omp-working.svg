<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- omp's logo with its startup sweep: the gradient slides along the diagonal. Reflect keeps it
       seamless and inside omp's three colours. The endpoints animate, not gradientTransform,
       because WebKit leaves an animated gradientTransform frozen. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1" spreadMethod="reflect">
      <stop offset="0" stop-color="#ed4abf" />
      <stop offset=".5" stop-color="#9b4dff" />
      <stop offset="1" stop-color="#5ad8e6" />
      <animate attributeName="x1" from="0" to="-2" dur="3s" repeatCount="indefinite" />
      <animate attributeName="y1" from="0" to="-2" dur="3s" repeatCount="indefinite" />
      <animate attributeName="x2" from="1" to="-1" dur="3s" repeatCount="indefinite" />
      <animate attributeName="y2" from="1" to="-1" dur="3s" repeatCount="indefinite" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="12" fill="#0f0a14" />
  <path fill="url(#g)" d="M14 16h36v8H40v32h-8V24h-6v22h-8V24h-4z" />
</svg>
