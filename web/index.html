<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0f14" />
<!-- Full screen on phones: launch from the home-screen icon (Add to Home Screen).
     The manifest's display:standalone covers Android/modern iOS; these metas cover
     the iOS legacy path and the status-bar treatment. black-translucent lets content
     extend under the status bar — the body already pads env(safe-area-inset-top). -->
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="tmux-rc" />
<!-- iOS ignores SVG manifest icons; without this PNG the home-screen icon is a
     page screenshot. Regenerate:
     rsvg-convert -w 180 -h 180 web/icon.svg > web/apple-touch-icon.png -->
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<!-- use-credentials: browsers fetch the manifest WITHOUT cookies by default, and
     behind IAP that gets a 401 — no valid manifest, no standalone/install. -->
<link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
<link rel="icon" href="/favicon.ico?v=1" sizes="any" />
<title>tmuxʳᶜ</title>
<!-- Theme boot, inline so it runs before first paint (a module script would flash
     dark). "tmuxrc-theme" is a manual override; absent means follow the OS. app.js
     owns the toggle button, persistence and the theme-color meta from here on. -->
<script>
  (function () { /* IIFE: nothing here may leak onto window */
    var t = null;
    try { t = localStorage.getItem("tmuxrc-theme"); } catch (e) {} /* private mode ⇒ no override */
    /* Only the storage read needs guarding — a throw there must NOT skip the OS check.
       Only the two known values count as an override; junk/legacy falls back to auto. */
    if (t !== "light" && t !== "dark") t = null;
    if (t === "light" || (!t && matchMedia("(prefers-color-scheme: light)").matches)) {
      document.documentElement.classList.add("light");
      /* Status bar must not flash dark before app.js syncs it. Literal hex: this runs
         before <style> parses, so it can't read --bg — keep in sync with :root.light. */
      document.querySelector('meta[name="theme-color"]').content = "#f6f8fa";
    }
  })();
</script>
<style>
  /* Theme palette. Dark (GitHub-dark-like) is the default; html.light swaps in a
     GitHub-light-like set for sunlight readability. Terminal surfaces (.bg-wrap /
     .bg-term, .screen-*, .fsbtn) keep LITERAL dark hexes instead of these vars —
     terminals are dark, and the ANSI palette in terminal.js is tuned for it. */
  :root {
    color-scheme: dark;
    --bg: #0b0f14; --bg-glass: #0b0f14e6; --bar-bg: #0d1117;
    --surface: #161b22; --chrome: #21262d; --chrome-2: #2d333b; --border: #30363d;
    --fg: #e6edf3; --fg-soft: #c9d1d9; --fg-mid: #adbac7; --fg-dim: #8b949e; --fg-faint: #6e7681;
    --accent: #388bfd; --accent-glow: #388bfd44; --accent-text: #58a6ff;
    --green: #3fb950; --green-bright: #7ee787; --green-bg: #12331f;
    --amber: #d29922; --amber-text: #e3b341; --amber-bg: #3d2e0a; --waiting-bg: #1c1a12;
    --purple: #a371f7; --purple-bg: #2a1e40; --agents-bg: #2d2540; --agents-fg: #c8a6ff;
    --red: #f85149; --red-bg: #3d1d20; --green-glow: #3fb95033;
    --brand: #1BB91F; /* tmux green; darkened in light for contrast on near-white */
    --link: #8ecbff; --link-bg: #1d3b53; --link-bg-active: #27506f; --sel-bg: #1f2b3d;
  }
  /* Light: text tiers re-picked for contrast on near-white (not just inverted grays),
     and the amber/green/purple accents darkened so 11-13px badge text stays legible. */
  :root.light {
    color-scheme: light;
    --bg: #f6f8fa; --bg-glass: #f6f8fae6; --bar-bg: #ffffff;
    --surface: #ffffff; --chrome: #eaeef2; --chrome-2: #d7dde3; --border: #d0d7de;
    --fg: #1f2328; --fg-soft: #24292f; --fg-mid: #424a53; --fg-dim: #57606a; --fg-faint: #6e7781;
    --accent: #0969da; --accent-glow: #0969da33; --accent-text: #0969da;
    --green: #1a7f37; --green-bright: #1a7f37; --green-bg: #dafbe1;
    --amber: #bf8700; --amber-text: #9a6700; --amber-bg: #fff8c5; --waiting-bg: #fff8c5;
    --purple: #8250df; --purple-bg: #fbefff; --agents-bg: #fbefff; --agents-fg: #8250df;
    --red: #cf222e; --red-bg: #ffebe9; --green-glow: #1a7f3733;
    --brand: #0e7a13;
    --link: #0969da; --link-bg: #ddf4ff; --link-bg-active: #b6e3ff; --sel-bg: #ddf4ff;
  }
  /* Terminal-capture font stack. ui-monospace (SF Mono on iOS/macOS) lacks the
     Unicode box-drawing block (─ │ ┼ …), so WebKit substitutes those glyphs from a
     PROPORTIONAL fallback face — different advance width, so table columns drift out
     of alignment. Menlo (present on every Apple device) and DejaVu/Consolas cover the
     block with true fixed-width metrics; CSS per-glyph fallback picks them up for just
     those code points while ASCII still renders in the preferred ui-monospace. */
  :root { --mono-term: ui-monospace, Menlo, "DejaVu Sans Mono", Consolas, monospace; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* Flex-column layout: header + scrolling panes + bar. The bar is a normal flex
     child (NOT position:fixed), so when the mobile keyboard opens and shrinks the
     visual viewport, the layout compresses and the bar stays right above the keyboard
     — cards scroll within #panes instead of the whole page scrolling off. Uses dvh so
     it tracks the keyboard-adjusted viewport. */
  body {
    margin: 0; font: 15px/1.4 -apple-system, system-ui, sans-serif;
    background: var(--bg); color: var(--fg);
    padding: env(safe-area-inset-top) 0 0;
  }
  #top { position: sticky; top: 0; z-index: 5; background: var(--bg-glass); backdrop-filter: blur(8px); }
  /* No bottom gap: the active card below butts against the dock so the two read as one
     tab-header unit (selected icon = the tab, card = its body). */
  #top .dock { margin: 0 12px 0; }
  #top .dock:empty { display: none; }
  header {
    padding: 12px 16px 4px; font-weight: 600; font-size: 17px;
    display: flex; justify-content: space-between; align-items: center;
    position: relative; /* containing block for the #usage telemetry popover */
  }
  .brand { display: inline-flex; align-items: flex-start; gap: 3px; }
  .brand-logo { height: 20px; display: block; }
  /* The logo SVG is dark-tuned (near-white screen face) — invert+hue-rotate flips its
     luminance for light mode while keeping the greens green (same trick as sun mode);
     recoloring per-fill isn't possible on an <img>-loaded SVG without inlining 4.5KB. */
  :root.light .brand-logo { filter: invert(1) hue-rotate(180deg); }
  .brand-sup { font-size: 14px; line-height: 1; color: var(--brand); font-weight: 700; }
  /* Non-active panes: one compact row each (icon · title · badge), stacked above the
     active pane's full card — whole-fleet status at a glance, tap to switch. */
  .prow { display: flex; align-items: center; gap: 10px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; cursor: pointer; }
  .prow.waiting { border-color: var(--amber); background: var(--waiting-bg); }
  .prow.sel { border-color: var(--accent); }
  /* List-mode session divider (multi-session decks only): a quiet group label, not a
     row — no surface/border, so the eye reads rows as members, headers as structure. */
  /* One hue per session ORDINAL (position in the deck, cycling by 4), shared by the
     dock's group rail and the list's session header so both surfaces name the same
     session in the same color. Mid-tone, legible on dark and light, and deliberately
     none of the green/amber/purple activity-state hues. */
  :root { --sessc1: #5b8def; --sessc2: #b06fc9; --sessc3: #3fa587; --sessc4: #c9884a; }
  .sess-hdr { color: var(--fg-faint); font-size: 12px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.06em; padding: 10px 4px 0; }
  .sess-hdr:first-child { padding-top: 2px; }
  .sess-hdr.c1 { color: var(--sessc1); } .sess-hdr.c2 { color: var(--sessc2); }
  .sess-hdr.c3 { color: var(--sessc3); } .sess-hdr.c4 { color: var(--sessc4); }
  /* tmux window number leading a row's name — the number the user's own status bar
     shows. Faint and tabular so a column of rows aligns. */
  .wnum { color: var(--fg-faint); font-weight: 600; font-variant-numeric: tabular-nums;
    margin-right: 7px; }
  /* No left padding: icons always sit pulled to the left edge, so selecting the first
     pane (whose tab joins flush-left) never shifts the row. */
  .prow.dock { gap: 4px; padding: 4px 8px 4px 0; overflow-x: auto; scrollbar-width: none; }
  .prow.dock::-webkit-scrollbar { display: none; }
  /* Session trays in the dock (.grouped = the deck spans >1 session; single-session
     docks get no chrome and no extra padding — nothing changes until sessions
     multiply). One span per session's run of icons; a colored top rail + session
     name over each group, Chrome-tab-group style.
     GEOMETRY CONTRACT: the tab-into-card join (below) works because the strip's
     content height is defined by the icons themselves and the selected icon's
     negative bottom margin rests it on the dock's padding-box bottom. The tray must
     therefore add ZERO height anywhere in that chain: the group stretches to the
     strip and centers its icons exactly as the dock did when they were its direct
     children, and the rail + label are absolutely-positioned chrome painted in
     padding-top the DOCK reserves — inside the scroller's clip (which cuts at the
     padding box), above the icons, contributing no layout size. An earlier variant
     put the chrome in the group's own border+padding; that inflated the group box,
     un-seated the selected tab and broke the join. Hues cycle by POSITION —
     structural, deliberately not the green/amber activity language. */
  .prow.dock.grouped { padding-top: 17px; }  /* 4px strip pad + 13px tray chrome */
  .dock-group { display: flex; gap: 4px; align-items: center; align-self: stretch;
    flex: none; position: relative; --grp: var(--fg-faint); }
  .grouped .dock-group::before { content: ""; position: absolute; top: -4px;
    left: 0; right: 0; border-top: 2px solid var(--grp);
    border-radius: 3px 3px 0 0; pointer-events: none; }
  /* The label clips ITSELF (left+right insets + overflow) — never the group, whose
     overflow must stay visible for the icons' keyboard focus outlines. */
  .grouped .dock-group::after { content: attr(data-sess); position: absolute;
    top: -15px; left: 2px; right: 2px; overflow: hidden; font-size: 9px;
    line-height: 1; white-space: nowrap; color: var(--grp); font-weight: 700;
    letter-spacing: 0.05em; text-transform: uppercase; pointer-events: none; }
  .grouped .dock-group + .dock-group { margin-left: 6px; }
  .dock-group:nth-of-type(4n+1) { --grp: var(--sessc1); }
  .dock-group:nth-of-type(4n+2) { --grp: var(--sessc2); }
  .dock-group:nth-of-type(4n+3) { --grp: var(--sessc3); }
  .dock-group:nth-of-type(4n) { --grp: var(--sessc4); }
  .dock-icon { position: relative; background: transparent; border: 1px solid transparent;
    border-radius: 8px; padding: 6px 8px; cursor: pointer; color: var(--fg-mid);
    font-size: 16px; flex: none; display: flex; align-items: center; justify-content: center; }
  .dock-icon.sel { background: var(--chrome); border-color: var(--accent); }
  /* Corner badge over the logo (favicon-style), dark ring for contrast. */
  .ddot { position: absolute; top: 2px; right: 2px; width: 7px; height: 7px;
    border-radius: 50%; background: var(--fg-faint); box-shadow: 0 0 0 2px var(--surface); }
  /* Running-subagent count, subscripted in the bottom-right corner (opposite the
     activity dot). Purple echoes the .chip.agents "spawned workers" language. */
  .sacount { position: absolute; bottom: 0; right: 0; min-width: 13px; height: 13px;
    padding: 0 3px; border-radius: 7px; background: #6f42c1; color: #fff; font-size: 9px;
    line-height: 13px; font-weight: 700; text-align: center; box-shadow: 0 0 0 2px var(--surface); }
  .dock-counts { margin-left: auto; display: flex; gap: 4px; flex: none; align-items: center; }
  /* Same badges, now homed in the header: no auto-margin (space-between already sets the
     three-column layout), and on a tight phone they scroll horizontally rather than shove
     the brand or the mic pill off-screen. */
  #filters { margin-left: 0; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none;
    justify-content: center; padding: 0 8px; }
  #filters::-webkit-scrollbar { display: none; }
  #filters:empty { display: none; }
  .dock-counts .badge { border: 0; cursor: pointer; font-family: inherit; }
  .badge.b-all { background: var(--chrome); color: var(--fg-mid); }
  .dim { color: var(--fg-faint); }
  .d-running { background: var(--green); } .d-waiting { background: var(--amber-text); }
  /* Compacting: agent is condensing its own context — busy, but housekeeping, not user
     work. Purple sets it apart from running-green at a glance. */
  .d-compacting { background: var(--purple); }
  /* Shared pane-header layout (paneHeader) — used by BOTH the list rows (.prow) and the
     expanded card (.row) so they can't diverge. Left column stretches + ellipsizes; the
     right column stacks the working sub-line ABOVE the activity badge, fully right. */
  .ph-meta { flex: 1; min-width: 0; }
  .ph-name { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-weight: 600; }
  .ph-sub { color: var(--fg-dim); font-size: 13px; overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .ph-right { flex: none; display: flex; flex-direction: column; align-items: flex-end;
    gap: 4px; text-align: right; }
  .ph-right .worksub { white-space: nowrap; }
  header .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
  header .off { background: var(--fg-faint); }
  /* Reconnecting: the gray dot pulses (reuses lm-pulse) — the quiet "working on it"
     signal while the deck stays up through a transient poll failure (app resume). */
  header .dot.rc { animation: lm-pulse 1.4s ease-in-out infinite; }
  .hdr-right { display: inline-flex; align-items: center; gap: 12px; }
  /* Docs link: quiet by default like the rest of the header chrome, brightens on hover. */
  #docs-link { font-size: 12px; font-weight: 600; color: var(--fg-faint); text-decoration: none;
    letter-spacing: .02em; }
  #docs-link:hover { color: var(--accent); }
  /* Theme toggle: quiet header chrome like the docs link — a 12px glyph showing the
     mode a tap switches TO (app.js keeps glyph + aria-pressed in sync). Padding grows
     the TAP TARGET to finger size; the negative margin cancels it visually so the
     header layout doesn't shift. */
  #theme-btn { background: transparent; border: 0; padding: 10px; margin: -10px;
    font-size: 12px; line-height: 1; color: var(--fg-faint); cursor: pointer; }
  #theme-btn:hover { color: var(--accent); }
  /* overflow-x hidden: swipe gestures park the neighbor card off-screen with
     transforms — without this the page itself grows a horizontal scrollbar. */
  body { overflow-x: hidden; }
  /* --bar-h / --top-h are MEASURED by JS (ResizeObserver) — the layout math below
     uses them instead of eyeballed constants that drift per device/content. */
  /* The bottom padding keeps LIST-mode rows clear of the fixed input bar. It must not
     apply in card mode: the deck is already sized to the remaining viewport and already
     runs under the bar through its own negative bottom margin, so adding bar-height
     padding underneath double-counts it — measured 787px of content in a 725px viewport,
     which scrolled the whole document ~62px behind the card and produced a SECOND
     scrollbar outside the card's own. A CLASS (#panes.cardmode, toggled in render) scopes
     it to the mode that needs it — deliberately NOT :has(), which this codebase avoids for
     older iOS Safari; there the rule would be ignored and the bug would persist on exactly
     the phones this app targets. */
  #panes { padding: 8px 12px calc(var(--bar-h, 150px) + 8px); display: flex; flex-direction: column; gap: 10px; overflow-x: hidden; }
  #panes.cardmode { padding-bottom: 0; }
  /* The deck fills the viewport below the dock, running UNDER the fixed input bar.
     The pane's capture is its background (bottom-anchored, so the agent's status/input
     chrome lines hide behind the bar); the card floats over the top, content-sized,
     with the live terminal tail poking out BELOW it — pan/zoomable in place. The
     negative margin pulls the deck's bottom back up under the fixed bar, so the deck's
     full-viewport height does not extend the page. It no longer "cancels #panes' bar
     padding": that padding is now switched OFF in card mode (see #panes.cardmode
     above), because having both was double-counting the bar height and scrolling the
     whole document behind the card. The two mechanisms are independent — this margin
     positions the deck, that rule keeps list-mode rows clear of the bar. */
  .deck { position: relative; height: calc(100dvh - var(--top-h, 122px)); /* top pad cancelled by the join margin below */
    margin-bottom: calc(-1 * (var(--bar-h, 150px) + 8px));
    overflow: hidden; display: flex; flex-direction: column; }
  /* The card COVERS the terminal — it is a sheet lying on top of it, not a panel butted
     against it. Two things make that read:
       - The bottom corners overlap the terminal instead of exposing it. .bg-wrap is a flex
         sibling starting exactly at the card's bottom edge, so a 14px bottom radius let the
         #0d1117 surface show through the corner arcs as two sharp dark wedges — the giveaway
         that the card was merely adjacent. A negative bottom margin slides the card's last
         14px over the terminal (its own background fills the corners) and z-index keeps it
         above; the terminal's visible height is unchanged because .bg-wrap's flex basis is
         computed before the margin.
       - A drop shadow gives it height off the surface. Tuned per theme below, since one
         shadow cannot read correctly on both: dark needs depth from a near-black card on a
         near-black terminal, light needs a soft grey that doesn't look like dirt. */
  .card {
    --card-radius: 14px; /* ONE definition: the overlap below must equal the radius, or
                            the corner arcs expose the terminal again as sharp wedges */
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--card-radius);
    padding: 12px 14px; overflow-y: auto; position: relative; z-index: 2; flex: none;
    max-height: calc(100% - var(--bar-h, 150px) - 80px); /* ≥~5 terminal lines stay visible */
    margin-bottom: calc(-1 * var(--card-radius)); /* the corner arcs land ON the terminal */
    box-shadow: var(--card-lift);
  }
  /* ONE definition of the lift, so .card and .card.active cannot drift apart. Per-theme
     because a single shadow cannot read correctly on both: dark needs real depth to
     separate a near-black card from a near-black terminal, and those same alphas read as
     grime on near-white. */
  :root { --card-lift: 0 6px 16px -4px #0008, 0 2px 6px -2px #0006; }
  :root.light { --card-lift: 0 6px 16px -6px #1f23281f, 0 2px 5px -2px #1f232814; }
  /* The card is scrollable, so its shadow must not be clipped by its own overflow box —
     it isn't (box-shadow paints outside), but the DECK clips overflow, and the bottom
     shadow now falls inside the deck rather than past its edge, so it survives. */
  /* The capture's window: right below the card down to the bar. Agent panes overlap
     the bar a little (their tail is status/input chrome); shells stop above it so a
     trailing prompt stays visible. Long captures are scrolled to their tail. */
  .bg-wrap { flex: 1; min-height: 0; overflow: hidden; touch-action: none;
    margin-bottom: calc(var(--bar-h, 150px) - 60px); }
  .bg-wrap.shell { margin-bottom: calc(var(--bar-h, 150px) + 6px); }
  /* Terminal-dark background on the SURFACE (not just per-span): subpixel line-box
     rounding leaves hairline gaps between colored rows, and on a fractional-DPR
     display those gaps showed the page black (the "black lines on one screen only").
     Filling the surface makes any gap blend. line-height 1.2 keeps leading tight. */
  .bg-wrap { background: #0d1117; }
  .bg-term { margin: 0; padding: 4px 12px; font: 10px/1.2 var(--mono-term);
    color: #8b949e; white-space: pre; background: #0d1117; }
  /* appearance/padding reset: mobile browsers pad native buttons and ignore the
     fixed box, squishing the glyph off-center. Flex centers it exactly.
     Literal dark values (not theme vars): it floats over the always-dark terminal. */
  .fsbtn { position: absolute; right: 10px; bottom: calc(var(--bar-h, 150px) + 14px);
    z-index: 2; width: 38px; height: 38px; appearance: none; -webkit-appearance: none;
    padding: 0; line-height: 1; display: flex; align-items: center; justify-content: center;
    background: #21262dcc; border: 1px solid #30363d; color: #adbac7; border-radius: 8px;
    font-size: 18px; cursor: pointer; }
  .card { transition: transform .15s, opacity .15s; }
  /* Swipe neighbour: same cover treatment, so a mid-swipe card doesn't briefly show the
     bare corner wedges the real card no longer has. z-index 1 keeps it under the real card
     (which is 2) while both sit above the terminal. */
  .card.ghost { position: absolute; top: 0; left: 0; width: 100%; pointer-events: none; z-index: 1; }
  .card.waiting { border-color: var(--amber); background: var(--waiting-bg); }
  /* The accent ring must ADD to the lift, not replace it — box-shadow is one property, so
     listing only the ring here would drop the drop-shadow on the active card, i.e. on the
     card the user is actually looking at almost all the time. Ring first (tight to the
     border), depth after. */
  .card.active { border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent-glow), var(--card-lift); }
  /* Tab-into-card join (card mode). Structure, not pixel-chasing:
     - The dock's bottom OPENS: border 0, square bottom corners. Its bottom edge is
       simply where the card begins.
     - .deck margin cancels #panes' top pad EXACTLY, so card top edge == dock bottom
       edge, and the card's blue top border becomes the rail's bottom line.
     - The selected icon reaches down to that line: its negative margin swallows the
       dock's own bottom padding, so it stays INSIDE the overflow-clip region (the
       scroller clips at the padding box — anything past it gets cut, which is why
       overhang-into-the-card approaches kept failing). Open bottom, card-colored
       background: the icon's interior fuses with the card's.
     - JS lays a 1px card-colored .tab-notch over the card's border directly under the
       icon (position measured, re-pinned on dock scroll), breaking the blue line so
       the icon's outline flows into the card's — a true tab. */
  .deck { margin-top: -8px; }
  #top .dock.has-sel { border-bottom: 0; border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
  .dock.has-sel .dock-icon.sel { border-bottom: 0; border-bottom-left-radius: 0;
    border-bottom-right-radius: 0; margin-bottom: -4px; padding-bottom: 11px; background: var(--surface); }
  /* Keep the sub-agent badge OFF the join, and STILL while selecting. .sacount is
     anchored bottom:0 of the icon's padding box; the rule above grows that box downward
     (padding-bottom 6px → 11px, and border-bottom 1px → 0 which drops the padding-box
     edge 1px further), so on selection the badge rode down onto the tab's foot and its
     2px --surface ring straddled the card's top border — punching a hole in the blue line
     and in the right fillet's arc.
     The offset is 5px, not 6: `bottom` is measured from the padding box's inner edge, so
     the removed border already accounts for 1px of the 6px box growth. MEASURED, not
     derived — at 5px the badge's box bottom is 93 selected and unselected alike (so the
     number does not shift when you tap a tab). The ring's 2px spread would reach 95, but
     the dock is an overflow-x scroller, so it is CLIPPED at 94 — nothing paints below
     that, which is what keeps it off the card line at 98. That 1px of clipped spread is
     also why the unselected badge already looks right: same overhang, same clip. 6px
     looked right on paper but lifted the number 1px, which reads as a twitch on tap.
     Invisible while the ring was hard-coded near-black (it matched the dark chrome);
     themed --surface made it #fff in light mode, which is when the "lines under the
     icon" appeared. */

    border: 1px solid var(--border); border-radius: 10px; font-size: 13px;
    display: flex; flex-direction: column; gap: 6px;
    min-height: 120px; max-height: 45vh; overflow-y: auto; }
  /* Neutral until something is said — the mic pulse/label carries connect/listen state,
     so this must not claim "listening" during connecting/reconnecting. */
  .lm-convo:empty::before { content: "Live Mode — your conversation appears here"; color: var(--fg-faint); }
  .lm-convo .lm-user { color: var(--link); }
  .lm-convo .lm-model { color: var(--fg); }
  /* A typed action: unmissable — this is the model touching a real terminal. */
  .lm-convo .lm-typed { color: var(--green-bright); font-family: ui-monospace, monospace; }
  .lm-convo .lm-err { color: var(--red); }
  /* Tucked behind the status dot: a popover pinned to the header's right edge, shown only
     while the dot is toggled on (#usage[hidden] otherwise). Dim debug chrome, so it reads
     recessed even when open — it's for us, not the operator. */
  .usage { position: absolute; top: 100%; right: 12px; z-index: 6; margin-top: 2px;
    max-width: calc(100vw - 24px); display: flex; flex-direction: column; gap: 6px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
    box-shadow: 0 4px 16px #0008;
    font-size: 12px; color: var(--fg-dim); font-weight: 400; }
  .usage[hidden] { display: none; }
  /* One labeled row per stat: description left (dim), value right (mono) — a menu you
     can actually read, not a strip smeared over the tab headers. */
  .usage .u-row { display: flex; justify-content: space-between; align-items: baseline; gap: 18px; }
  .usage .u-val { font-family: var(--mono-term); color: var(--fg); }
  .usage .u-docs { border-top: 1px solid var(--border); margin-top: 2px; padding-top: 8px; }
  .usage .u-docs:first-child { border-top: 0; margin-top: 0; padding-top: 0; }
  /* The dot lights green when the telemetry popover is open — a subtle "you tapped me". */
  header .dot[aria-expanded="true"] { box-shadow: 0 0 0 3px var(--green-glow); }
  /* The dot is an 8×8 visual, but it's now a tap toggle — an invisible pseudo-element
     grows the hit area to ~40px (touch-target minimum) without inflating the dot. It's
     the rightmost header control, with 16px header padding to its right, so the hit area
     extends into that padding rather than overlapping the docs link on its left. */
  header .dot { cursor: pointer; position: relative; }
  header .dot::after { content: ""; position: absolute; top: 50%; left: 0;
    width: 40px; height: 40px; margin-left: -8px; transform: translateY(-50%); }
  .usage .err { color: var(--red); }
  .usage .warn { color: var(--amber-text); }  /* transient LLM error hint, subtle not shouty */
.links { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 2px; }
.linkbtn { display: inline-block; padding: 6px 10px; border-radius: 8px;
  background: var(--link-bg); color: var(--link); text-decoration: none; font-size: 13px; }
.linkbtn:active { background: var(--link-bg-active); }
.linkhost { opacity: .6; font-size: 11px; unicode-bidi: isolate; }
  /* Lucide link glyph in the chip (replaced the 🔗 emoji — AGENTS.md bans emoji as
     chrome). Inline-flex so it sits on the text baseline without stretching the chip. */
  .linkicon { display: inline-flex; vertical-align: -2px; margin-right: 5px; opacity: .8; }
  /* Paste-me-elsewhere text (copyables): one full-width row per item, since the label
     is a sentence-ish summary that shouldn't be squeezed beside a sibling. Chrome
     styling, not link-blue — copying is a local action, nothing navigates. */
  .copyables { display: flex; flex-direction: column; gap: 6px; margin: 6px 0 2px; }
  /* Icon + a two-line stack (label over payload preview). The stack is the flex child
     that shrinks (min-width:0) so the icon is never what gets clipped; each line
     ellipsizes independently. align-items:flex-start keeps the icon on the label's line
     rather than floating between the two. */
  .copybtn { display: flex; align-items: flex-start; gap: 7px; width: 100%;
    text-align: left; padding: 8px 10px;
    border-radius: 8px; background: var(--chrome); color: var(--fg-soft);
    border: 1px solid var(--border); font: inherit; font-size: 13px; cursor: pointer; }
  .copylines { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  /* Both lines are untrusted model/pane content: isolate bidi, ellipsize, never wrap. */
  .copylines > span { min-width: 0; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; unicode-bidi: isolate; }
  /* The preview is the actual payload — monospace (it's terminal text, and a token or
     command reads wrong in the UI face) and dimmer, so the label stays the heading. */
  .copyprev { font-family: var(--mono-term); font-size: 11px; color: var(--fg-dim); }
  .copybtn.copied .copyprev { opacity: .7; }
  .copyicon { flex: none; display: flex; opacity: .75; margin-top: 2px; }
  .copybtn:active { background: var(--chrome-2); }
  /* Confirmation: green for the ~1.6s the button reports the copy landed. */
  .copybtn.copied { background: var(--green-bg); color: var(--green-bright);
    border-color: var(--green); }
.screen-pre a, .bg-term a { color: #8ecbff; } /* on the dark terminal, both themes */
/* Live = color; quiet/stale stream = desaturate to gray (docs/design/live-view.md).
   A CSS filter, not a re-render — it dims the colors while leaving link <a>s and text
   intact, and the next live frame just removes the class. .stale is set on the <pre>
   (fullscreen) or the .bg-wrap (peek); target the rendered <pre> either way. */
.bg-term.stale, .bg-wrap.stale .bg-term, .screen-pre.stale {
  filter: grayscale(1) opacity(.6); transition: filter .3s; }
</style>
</head>
<body>
  <!-- Sticky top block: header + dock. The dock's height never changes (icons for
       every pane, always) — expanding rows or swiping cards moves content BELOW it. -->
  <div id="top">
    <header>
      <!-- tmux logo (ISC, © 2015 Jason Long — see tmux-logo.LICENSE; screen fill
           lightened for the dark background) with our "rc" as a superscript. -->
      <span class="brand"><img src="/tmux-logo.svg" alt="tmux" class="brand-logo" /><sup class="brand-sup">rc</sup></span>
      <!-- Pane filters live here (always visible), not in the dock strip where they'd
           scroll off once enough panes fill the width. Built by dock(). -->
      <span id="filters" class="dock-counts"></span>
      <span class="hdr-right">
        <button id="lm-btn" hidden title="Live Mode (experimental) — talk to your session" aria-label="Start Live Mode (experimental)"></button>
        <button id="theme-btn" title="Switch to light mode" aria-label="Light mode" aria-pressed="false"></button>
        <!-- docs link lives INSIDE the status-dot popover (see showUsage) — the top
             bar is too tight on phones to spend on a rarely-tapped link. -->
        <!-- Status dot doubles as the LLM-telemetry toggle: the stats are dim debug
             chrome, so they stay hidden until you tap the dot (see #usage popover). -->
        <span id="live" class="dot off" title="connection" role="button" tabindex="0" aria-expanded="false" aria-controls="usage" aria-label="Connection status — tap for LLM telemetry"></span>
        <span id="usage" class="usage" role="region" aria-label="LLM telemetry and links" hidden></span>
      </span>
    </header>

    <div id="dock" class="prow dock"></div>
  </div>
  <div id="panes"><div class="empty">Connecting…</div></div>
  <!-- Single persistent input bar, fixed at the bottom. Targets the active card. -->
  <div id="bar">
    <!-- Special keys, hidden by default (toggled by the ⌨ button in the input) so they
         don't cost a permanent row of vertical space. -->
    <div class="keys" id="bar-keys" hidden>
      <button data-k="Enter">⏎ Enter</button>
      <button data-k="Escape">Esc</button>
      <button data-k="Up">↑</button>
      <button data-k="Down">↓</button>
      <button data-k="C-o">Ctrl-O</button>
      <button id="bar-prefix" data-k="C-b" title="tmux prefix">Prefix</button>
      <!-- Ctrl-B as a LITERAL key, distinct from the Prefix button above. Prefix sends
           whatever tmux reports as its own prefix (this host: C-a), so on any setup that
           remapped it there was no way to send a real Ctrl-B — which nested tmux sessions
           and editors/pagers that bind it themselves need. -->
      <button id="bar-ctrl-b" data-k="C-b">Ctrl-B</button>
      <button data-k="C-c">Ctrl-C</button>
      <button data-k="C-d">Ctrl-D</button>
    </div>
    <div class="freetext">
      <div class="inputwrap">
        <button id="bar-keys-toggle" class="attach" title="Special keys" aria-label="Special keys" aria-pressed="false"></button>
        <button id="bar-attach" class="attach" title="Attach image" aria-label="Attach image"></button>
        <!-- Rich composer: contenteditable (not <input>) so image thumbnails can sit
             INLINE at the caret, interleaved with typed text — the ORDER of text vs.
             images is what we send (see submitComposer's DOM walk). A plain <input>
             can't hold child nodes, so images used to pile up to the left of the bar
             and their paths landed at the END of the message. Placeholder is drawn via
             CSS :empty::before from data-placeholder (contenteditable has no native
             placeholder). enterkeyhint is honoured by mobile keyboards; Enter-to-send
             is handled in JS. autocorrect/autocapitalize/spellcheck off, matching the
             old search field. role=textbox for a11y. -->
        <div id="bar-input" contenteditable="true" role="textbox" aria-multiline="true"
             aria-label="Type…" data-placeholder="Type…" inputmode="text"
             autocorrect="off" autocapitalize="off" spellcheck="false"
             enterkeyhint="send"></div>
        <!-- Send lives INSIDE the field (chat-composer style): muted until it matters. -->
        <button id="bar-send" class="send">Send</button>
      </div>
      <input id="bar-file" type="file" accept="image/*" hidden />
    </div>
    <!-- Active pane's meta chips (model · ctx% · cost · mode · agents), below the input. -->
    <div id="bar-meta" class="metarow"></div>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
