<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0f14" />
<!-- Full screen on phones: launch from the home-screen icon (Add to Home Screen).
     The manifest's display:standalone covers Android/modern iOS; these metas cover
     the iOS legacy path and the status-bar treatment. black-translucent lets content
     extend under the status bar — the body already pads env(safe-area-inset-top). -->
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="tmux-rc" />
<!-- iOS ignores SVG manifest icons; without this PNG the home-screen icon is a
     page screenshot. Regenerate:
     rsvg-convert -w 180 -h 180 web/icon.svg > web/apple-touch-icon.png -->
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<!-- use-credentials: browsers fetch the manifest WITHOUT cookies by default, and
     behind IAP that gets a 401 — no valid manifest, no standalone/install. -->
<link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
<link rel="icon" href="/favicon.ico?v=1" sizes="any" />
<title>tmuxʳᶜ</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* Flex-column layout: header + scrolling panes + bar. The bar is a normal flex
     child (NOT position:fixed), so when the mobile keyboard opens and shrinks the
     visual viewport, the layout compresses and the bar stays right above the keyboard
     — cards scroll within #panes instead of the whole page scrolling off. Uses dvh so
     it tracks the keyboard-adjusted viewport. */
  body {
    margin: 0; font: 15px/1.4 -apple-system, system-ui, sans-serif;
    background: #0b0f14; color: #e6edf3;
    padding: env(safe-area-inset-top) 0 0;
  }
  #top { position: sticky; top: 0; z-index: 5; background: #0b0f14e6; backdrop-filter: blur(8px); }
  /* No bottom gap: the active card below butts against the dock so the two read as one
     tab-header unit (selected icon = the tab, card = its body). */
  #top .dock { margin: 0 12px 0; }
  #top .dock:empty { display: none; }
  header {
    padding: 12px 16px 4px; font-weight: 600; font-size: 17px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .brand { display: inline-flex; align-items: flex-start; gap: 3px; }
  .brand-logo { height: 20px; display: block; }
  .brand-sup { font-size: 14px; line-height: 1; color: #1BB91F; font-weight: 700; }
  /* Non-active panes: one compact row each (icon · title · badge), stacked above the
     active pane's full card — whole-fleet status at a glance, tap to switch. */
  .prow { display: flex; align-items: center; gap: 10px; background: #161b22;
    border: 1px solid #30363d; border-radius: 10px; padding: 8px 12px; cursor: pointer; }
  .prow.waiting { border-color: #d29922; background: #1c1a12; }
  .prow.sel { border-color: #388bfd; }
  /* No left padding: icons always sit pulled to the left edge, so selecting the first
     pane (whose tab joins flush-left) never shifts the row. */
  .prow.dock { gap: 4px; padding: 4px 8px 4px 0; overflow-x: auto; scrollbar-width: none; }
  .prow.dock::-webkit-scrollbar { display: none; }
  .dock-icon { position: relative; background: transparent; border: 1px solid transparent;
    border-radius: 8px; padding: 6px 8px; cursor: pointer; color: #adbac7;
    font-size: 16px; flex: none; display: flex; align-items: center; justify-content: center; }
  .dock-icon.sel { background: #21262d; border-color: #388bfd; }
  /* Corner badge over the logo (favicon-style), dark ring for contrast. */
  .ddot { position: absolute; top: 2px; right: 2px; width: 7px; height: 7px;
    border-radius: 50%; background: #6e7681; box-shadow: 0 0 0 2px #0b0f14; }
  .dock-counts { margin-left: auto; display: flex; gap: 4px; flex: none; align-items: center; }
  .dock-counts .badge { border: 0; cursor: pointer; font-family: inherit; }
  .badge.b-all { background: #21262d; color: #adbac7; }
  .dim { color: #6e7681; }
  .d-running { background: #3fb950; } .d-waiting { background: #e3b341; }
  .prow-meta { flex: 1; min-width: 0; }
  .prow-name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; font-size: 14px; }
  .prow-sub { color: #8b949e; font-size: 12px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; }
  header .dot { width: 8px; height: 8px; border-radius: 50%; background: #3fb950; }
  header .off { background: #6e7681; }
  /* overflow-x hidden: swipe gestures park the neighbor card off-screen with
     transforms — without this the page itself grows a horizontal scrollbar. */
  body { overflow-x: hidden; }
  /* --bar-h / --top-h are MEASURED by JS (ResizeObserver) — the layout math below
     uses them instead of eyeballed constants that drift per device/content. */
  #panes { padding: 8px 12px calc(var(--bar-h, 150px) + 8px); display: flex; flex-direction: column; gap: 10px; overflow-x: hidden; }
  /* The deck fills the viewport below the dock, running UNDER the fixed input bar.
     The pane's capture is its background (bottom-anchored, so the agent's status/input
     chrome lines hide behind the bar); the card floats over the top, content-sized,
     with the live terminal tail poking out BELOW it — pan/zoomable in place. The
     negative margin cancels #panes' bar padding so the page itself never scrolls. */
  .deck { position: relative; height: calc(100dvh - var(--top-h, 122px)); /* top pad cancelled by the join margin below */
    margin-bottom: calc(-1 * (var(--bar-h, 150px) + 8px));
    overflow: hidden; display: flex; flex-direction: column; }
  .card {
    background: #161b22; border: 1px solid #30363d; border-radius: 14px;
    padding: 12px 14px; overflow-y: auto; position: relative; z-index: 1; flex: none;
    max-height: calc(100% - var(--bar-h, 150px) - 80px); /* ≥~5 terminal lines stay visible */
  }
  /* The capture's window: right below the card down to the bar. Agent panes overlap
     the bar a little (their tail is status/input chrome); shells stop above it so a
     trailing prompt stays visible. Long captures are scrolled to their tail. */
  .bg-wrap { flex: 1; min-height: 0; overflow: hidden; touch-action: none;
    margin-bottom: calc(var(--bar-h, 150px) - 60px); }
  .bg-wrap.shell { margin-bottom: calc(var(--bar-h, 150px) + 6px); }
  /* Terminal-dark background on the SURFACE (not just per-span): subpixel line-box
     rounding leaves hairline gaps between colored rows, and on a fractional-DPR
     display those gaps showed the page black (the "black lines on one screen only").
     Filling the surface makes any gap blend. line-height 1.2 keeps leading tight. */
  .bg-wrap { background: #0d1117; }
  .bg-term { margin: 0; padding: 4px 12px; font: 10px/1.2 ui-monospace, monospace;
    color: #8b949e; white-space: pre; background: #0d1117; }
  /* appearance/padding reset: mobile browsers pad native buttons and ignore the
     fixed box, squishing the glyph off-center. Flex centers it exactly. */
  .fsbtn { position: absolute; right: 10px; bottom: calc(var(--bar-h, 150px) + 14px);
    z-index: 2; width: 38px; height: 38px; appearance: none; -webkit-appearance: none;
    padding: 0; line-height: 1; display: flex; align-items: center; justify-content: center;
    background: #21262dcc; border: 1px solid #30363d; color: #adbac7; border-radius: 8px;
    font-size: 18px; cursor: pointer; }
  .card { transition: transform .15s, opacity .15s; }
  .card.ghost { position: absolute; top: 0; left: 0; width: 100%; pointer-events: none; z-index: 1; }
  .card.waiting { border-color: #d29922; background: #1c1a12; }
  .card.active { border-color: #388bfd; box-shadow: 0 0 0 1px #388bfd44; }
  /* Tab-into-card join (card mode). Structure, not pixel-chasing:
     - The dock's bottom OPENS: border 0, square bottom corners. Its bottom edge is
       simply where the card begins.
     - .deck margin cancels #panes' top pad EXACTLY, so card top edge == dock bottom
       edge, and the card's blue top border becomes the rail's bottom line.
     - The selected icon reaches down to that line: its negative margin swallows the
       dock's own bottom padding, so it stays INSIDE the overflow-clip region (the
       scroller clips at the padding box — anything past it gets cut, which is why
       overhang-into-the-card approaches kept failing). Open bottom, card-colored
       background: the icon's interior fuses with the card's.
     - JS lays a 1px card-colored .tab-notch over the card's border directly under the
       icon (position measured, re-pinned on dock scroll), breaking the blue line so
       the icon's outline flows into the card's — a true tab. */
  .deck { margin-top: -8px; }
  #top .dock.has-sel { border-bottom: 0; border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
  .dock.has-sel .dock-icon.sel { border-bottom: 0; border-bottom-left-radius: 0;
    border-bottom-right-radius: 0; margin-bottom: -4px; padding-bottom: 11px; background: #161b22; }
  .tab-notch { position: absolute; top: 0; height: 1px; background: #161b22; z-index: 2; pointer-events: none; }
  /* Edge tabs: a flare landing inside the card's corner-radius zone has no flat line
     to join (the border is curving away there) — square that corner instead. */
  .card.sq-l { border-top-left-radius: 0; }
  .card.sq-r { border-top-right-radius: 0; }
  /* FIRST tab selected: the rail's LEFT BORDER disappears (width 0, top-left corner
     squared so no gray arc dangles), which puts the flush tab's own blue left border
     exactly collinear with the card's border below — one straight contiguous line,
     and the tab keeps its normal rounded top corners like every other tab. */
  #top .dock.has-sel.edge-l { border-left: 0; border-top-left-radius: 0; }
  /* Chrome-style concave fillets at the tab's feet: the card line flares up into the
     tab's sides. Each is an 8×8 patch over the old sharp L-corner: a radial gradient
     paints the blue quarter-arc — tangent to the tab border's inner edge and the
     line's bottom edge — and fills both sides with the shared interior color (dock
     pill, tab, and card are all #161b22, so "erase and redraw curved" is this one
     gradient). The card's own top corners keep their normal convex radius — rounding,
     not flaring, is the right shape there (the tab is the only thing attached).
     Fillets live in #top — NOT the deck — because they extend above the card line and
     the deck clips its overflow. */
  .tab-fillet { position: absolute; width: 8px; height: 8px; z-index: 6; pointer-events: none; }
  .tab-fillet.l { background: radial-gradient(circle at top left, #161b22 6.5px, #388bfd 7px 8px, #161b22 8.5px); }
  .tab-fillet.r { background: radial-gradient(circle at top right, #161b22 6.5px, #388bfd 7px 8px, #161b22 8.5px); }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: #0d1117; border-top: 1px solid #30363d;
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px; }
  /* attach clip lives INSIDE the input field (like a chat composer) */
  .inputwrap { flex: 1; display: flex; align-items: center; background: #21262d; border: 1px solid #30363d; border-radius: 10px; padding-left: 6px; }
  /* Focus lights up the WHOLE composer (keys toggle, clip, thumbnail, Send) — the
     input's native ring would circle just the text field and orphan the rest. */
  .inputwrap:focus-within { border-color: #388bfd; box-shadow: 0 0 0 1px #388bfd44; }
  /* Forced-colors/high-contrast suppresses shadows and custom colors — give the
     wrapper a real outline there so keyboard focus stays visible. */
  @media (forced-colors: active) {
    .inputwrap:focus-within { outline: 2px solid Highlight; box-shadow: none; }
  }
  .inputwrap input { flex: 1; background: transparent; border: 0; color: #e6edf3; padding: 10px 12px 10px 4px; font-size: 15px; -webkit-appearance: none; outline: none; }
  .inputwrap input::-webkit-search-cancel-button { display: none; }
  .inputwrap .attach { background: transparent; border: 0; color: #8b949e; font-size: 14px;
    line-height: 1; cursor: pointer; padding: 0 3px; opacity: .8; }
  .inputwrap .attach[aria-pressed="true"] { color: #58a6ff; opacity: 1; }
  /* Pasted-image thumbnail: mirrors the image staged in the pane's own composer
     ([Image #N] in Claude Code) until the next Enter sends it (see attachChip).
     Selector outranks `.inputwrap input`, whose flex:1/padding would stretch it. */
  .inputwrap input.attach-chip { width: 24px; height: 24px; border-radius: 5px;
    object-fit: cover; flex: none; padding: 0; border: 0; margin: 0 2px;
    cursor: pointer; box-shadow: 0 0 0 1px #30363d; }
  .row { display: flex; align-items: center; gap: 10px; }
  .icon { font-size: 20px; width: 24px; height: 24px; text-align: center; display: flex; align-items: center; justify-content: center; }
  .icon svg { display: block; }
  .pulse {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: #3fb950; margin-right: 5px; vertical-align: middle;
    animation: pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
  .meta { flex: 1; min-width: 0; }
  .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status { color: #c9d1d9; font-size: 14px; overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .sub { color: #6e7681; font-size: 12px; margin-top: 3px; }
  .worksub { color: #6e7681; font-size: 11px; font-weight: 400; }
  /* Bar rows never wrap: one line each, extra chips/keys overflow off the edge
     (swipeable, scrollbar hidden) instead of growing the bar taller. */
  .metarow { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .metarow::-webkit-scrollbar { display: none; }
  .metarow:empty { display: none; }
  .chip {
    font-size: 11px; padding: 3px 8px; border-radius: 6px; font-weight: 600;
    background: #21262d; color: #adbac7; display: inline-flex; align-items: center; gap: 5px;
    flex: none; white-space: nowrap;
  }
  .ctxchip { position: relative; overflow: hidden; }
  .ctxchip > i { position: absolute; left: 0; top: 0; bottom: 0; background: #1f6feb44; z-index: 0; }
  .ctxchip { z-index: 1; }
  .chip.mode { color: #fff; }
  .mode-plan { background: #1f6feb; }
  .mode-accept-edits { background: #238636; }
  .mode-bypass { background: #b62324; }
  .chip.agents { background: #2d2540; color: #c8a6ff; }
  .badge {
    font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 600;
    white-space: nowrap;
  }
  .b-running { background: #12331f; color: #3fb950; }
  .b-idle { background: #21262d; color: #8b949e; }
  .b-waiting { background: #3d2e0a; color: #e3b341; }
  .b-unknown { background: #21262d; color: #8b949e; }
  .ctx { height: 4px; border-radius: 4px; background: #21262d; margin-top: 8px; overflow: hidden; }
  .ctx > i { display: block; height: 100%; background: #388bfd; }
  .q { margin-top: 12px; }
  /* Prompt is the prominent part (the context); options are secondary and compact so
     a long option list doesn't eat the whole card. */
  .q .prompt { font-weight: 600; font-size: 15px; margin-bottom: 8px; color: #e6edf3; }
  .opts { display: flex; flex-direction: column; gap: 5px; max-height: 40vh; overflow-y: auto; }
  button.opt {
    appearance: none; text-align: left; width: 100%;
    background: #21262d; color: #adbac7; border: 1px solid #30363d;
    border-radius: 8px; padding: 8px 12px; font-size: 13px; cursor: pointer;
  }
  button.opt:active { background: #30363d; }
  /* Structured tables: scroll horizontally AND vertically, capped so a big one doesn't
     dominate the card. */
  .tablewrap { margin-top: 12px; }
  .tbl-title { font-size: 12px; color: #8b949e; margin-bottom: 4px; }
  .tbl-scroll { max-height: 40vh; overflow: auto; border: 1px solid #30363d; border-radius: 8px; }
  .tbl-scroll table { border-collapse: collapse; font: 12px/1.3 ui-monospace, monospace; min-width: 100%; }
  .tbl-scroll th, .tbl-scroll td { padding: 5px 10px; border-bottom: 1px solid #21262d; border-right: 1px solid #21262d; white-space: nowrap; text-align: left; }
  .tbl-scroll th { background: #161b22; color: #c9d1d9; position: sticky; top: 0; }
  .tbl-scroll td { color: #adbac7; }
  .freetext { display: flex; gap: 8px; }
  .freetext input { flex: 1; background: #21262d; border: 1px solid #30363d; color: #e6edf3; border-radius: 10px; padding: 10px 12px; font-size: 15px; }
  /* The bar's Send sits INSIDE the field, quiet and gray (designer ref: composer-style
     "Ask"): the field is the affordance, the button shouldn't shout. */
  .inputwrap button.send { background: #2d333b; color: #adbac7; border: 0; border-radius: 8px;
    padding: 7px 14px; margin: 4px; font-size: 13px; font-weight: 600; flex: none; cursor: pointer; }
  .inputwrap button.send:active { background: #388bfd; color: #fff; }
  /* ~5 rows visible, scroll for the rest — the feed was eating 40vh and burying the
     terminal peek below the card, which is the thing worth the vertical space. */
  .events { margin-top: 12px; display: flex; flex-direction: column; gap: 6px;
    max-height: 8.5em; overflow-y: auto; }
  .events::-webkit-scrollbar { width: 6px; } .events::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
  /* Hierarchy: the session OVERVIEW is the headline content — bright, roomy (6 lines,
     tap for all of it). The recent-events log is supporting detail below it — smaller,
     dimmer, bulleted. (History reconstructed from scrollback dims further still.) */
  .sess-sum { margin-top: 10px; color: #c9d1d9; font-size: 14px; font-style: italic;
    display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical;
    overflow: hidden; cursor: pointer; }
  .sess-sum.open { -webkit-line-clamp: unset; }
  .ev { display: flex; align-items: baseline; gap: 8px; }
  .ev::before { content: "•"; color: #57606a; flex: none; }
  .ev-hist .ev-text { color: #6e7681; }
  .ev-text { flex: 1; color: #8b949e; font-size: 12px; min-width: 0; }
  .ev-note { flex: 0 0 auto; color: #6e7681; font-size: 11px; font-family: ui-monospace, monospace;
    white-space: nowrap; max-width: 45%; overflow: hidden; text-overflow: ellipsis; text-align: right; }
  .ev-note .add { color: #3fb950; } .ev-note .del { color: #f85149; margin-left: 3px; }
  .tasks { margin-top: 12px; border: 1px solid #30363d; border-radius: 10px; overflow: hidden; }
  .tasks-head { padding: 6px 12px; font-weight: 600; font-size: 12px; background: #161b22; color: #8b949e; border-bottom: 1px solid #30363d; }
  .task { padding: 6px 12px; font-size: 13px; color: #c9d1d9; display: flex; gap: 8px; }
  .task.done { color: #6e7681; text-decoration: line-through; }
  .task .tick { color: #3fb950; }
  .notable { margin-top: 10px; display: flex; flex-direction: column; gap: 4px; }
  .rewind { margin-top: 12px; border: 1px solid #30363d; border-radius: 10px; overflow: hidden; }
  .rw-head { padding: 8px 12px; font-weight: 600; font-size: 13px; background: #161b22; border-bottom: 1px solid #30363d; }
  .rw-more { color: #6e7681; font-weight: 400; }
  .rw-entry { display: flex; gap: 8px; align-items: baseline; padding: 8px 12px; font-size: 13px; border-bottom: 1px solid #21262d; }
  .rw-entry.sel { background: #1f2b3d; }
  .rw-cursor { width: 12px; color: #58a6ff; font-weight: 700; }
  .rw-text { flex: 1; color: #c9d1d9; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rw-entry.sel .rw-text { color: #fff; font-weight: 600; }
  .rw-note { color: #6e7681; font-size: 11px; white-space: nowrap; }
  .rw-note .add { color: #3fb950; } .rw-note .del { color: #f85149; }
  .rw-hint { padding: 8px 12px; font-size: 12px; color: #6e7681; }
  .raw { margin-top: 12px; }
  .raw .freetext { margin-bottom: 8px; }
  .keys { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .keys[hidden] { display: none; } /* author display:flex beats the UA [hidden] rule */
  .keys::-webkit-scrollbar { display: none; }
  .keys button {
    background: #21262d; color: #adbac7; border: 1px solid #30363d;
    border-radius: 8px; padding: 8px 12px; font-size: 13px; cursor: pointer;
    flex: none; white-space: nowrap;
  }
  .keys button:active { background: #30363d; }
  /* Full-screen raw-capture view, opened on demand (no poll flicker). */
  .screen-overlay { position: fixed; inset: 0; z-index: 50; background: #000000e6;
    display: flex; flex-direction: column; padding: env(safe-area-inset-top) 0 0; }
  .screen-head { display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px; border-bottom: 1px solid #30363d; font-weight: 600; }
  .screen-close { background: #21262d; border: 1px solid #30363d; color: #e6edf3;
    border-radius: 8px; width: 34px; height: 34px; font-size: 16px; cursor: pointer; }
  /* Pinch-to-zoom + pan the terminal content. The body is the gesture surface
     (touch-action:none so our JS owns pinch/drag); the <pre> is transformed. */
  .screen-body { flex: 1; overflow: hidden; touch-action: none; position: relative; background: #0d1117; }
  .screen-pre { margin: 0; padding: 12px 16px; white-space: pre; will-change: transform;
    font: 12px/1.2 ui-monospace, monospace; color: #c9d1d9; }
  .empty { text-align: center; color: #6e7681; padding: 60px 20px; }
  /* "New version" pill: only shown when a silent auto-reload would eat un-sent state
     (typed draft / staged image) — otherwise updates apply themselves. */
  #upbanner { position: fixed; top: calc(env(safe-area-inset-top) + 8px); left: 50%;
    transform: translateX(-50%); z-index: 100; background: #1f6feb; color: #fff;
    border: 0; border-radius: 999px; padding: 8px 16px; font-size: 13px;
    font-weight: 600; cursor: pointer; box-shadow: 0 4px 16px #000c; }
  .hdr-right { display: flex; align-items: center; gap: 10px; }
  /* Debug telemetry: recedes into the background (it's for us, not the operator) and
     brightens only on hover/focus/tap. The live dot beside it stays fully lit — that's
     the one always-relevant signal. */
  .usage { font-size: 11px; color: #484f58; font-family: ui-monospace, monospace; font-weight: 400;
    opacity: .55; transition: opacity .15s, color .15s; cursor: default; }
  .usage:hover, .usage:focus, .usage.lit { opacity: 1; color: #8b949e; }
  .usage .err { color: #f85149; }
  .usage .warn { color: #e3b341; }  /* transient LLM error hint, subtle not shouty */
.links { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 2px; }
.linkbtn { display: inline-block; padding: 6px 10px; border-radius: 8px;
  background: #1d3b53; color: #8ecbff; text-decoration: none; font-size: 13px; }
.linkbtn:active { background: #27506f; }
.linkhost { opacity: .6; font-size: 11px; unicode-bidi: isolate; }
.screen-pre a, .bg-term a { color: #8ecbff; }
/* Live = color; quiet/stale stream = desaturate to gray (docs/design/live-view.md).
   A CSS filter, not a re-render — it dims the colors while leaving link <a>s and text
   intact, and the next live frame just removes the class. .stale is set on the <pre>
   (fullscreen) or the .bg-wrap (peek); target the rendered <pre> either way. */
.bg-term.stale, .bg-wrap.stale .bg-term, .screen-pre.stale {
  filter: grayscale(1) opacity(.6); transition: filter .3s; }
</style>
</head>
<body>
  <!-- Sticky top block: header + dock. The dock's height never changes (icons for
       every pane, always) — expanding rows or swiping cards moves content BELOW it. -->
  <div id="top">
    <header>
      <!-- tmux logo (ISC, © 2015 Jason Long — see tmux-logo.LICENSE; screen fill
           lightened for the dark background) with our "rc" as a superscript. -->
      <span class="brand"><img src="/tmux-logo.svg" alt="tmux" class="brand-logo" /><sup class="brand-sup">rc</sup></span>
      <span class="hdr-right">
        <span id="usage" class="usage" role="button" tabindex="0" aria-pressed="false" aria-label="parser LLM telemetry"></span>
        <span id="live" class="dot off" title="connection"></span>
      </span>
    </header>
    <div id="dock" class="prow dock"></div>
  </div>
  <div id="panes"><div class="empty">Connecting…</div></div>
  <!-- Single persistent input bar, fixed at the bottom. Targets the active card. -->
  <div id="bar">
    <!-- Special keys, hidden by default (toggled by the ⌨ button in the input) so they
         don't cost a permanent row of vertical space. -->
    <div class="keys" id="bar-keys" hidden>
      <button data-k="Enter">⏎ Enter</button>
      <button data-k="Escape">Esc</button>
      <button data-k="Up">↑</button>
      <button data-k="Down">↓</button>
      <button data-k="C-o">Ctrl-O</button>
      <button id="bar-prefix" data-k="C-b" title="tmux prefix">Prefix</button>
      <button data-k="C-c">Ctrl-C</button>
      <button data-k="C-d">Ctrl-D</button>
    </div>
    <div class="freetext">
      <div class="inputwrap">
        <button id="bar-keys-toggle" class="attach" title="Special keys" aria-label="Special keys" aria-pressed="false">⌨</button>
        <button id="bar-attach" class="attach" title="Attach image" aria-label="Attach image">📎</button>
        <!-- type=search: Chrome's autofill heuristics treat a lone named text input as a
             potential username field and attach the password/payment keyboard accessory
             bar (which also overlaps the bar's bottom row); search fields are excluded. -->
        <input id="bar-input" placeholder="Type…" type="search" inputmode="text"
               autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
               enterkeyhint="send" />
        <!-- Send lives INSIDE the field (chat-composer style): muted until it matters. -->
        <button id="bar-send" class="send">Send</button>
      </div>
      <input id="bar-file" type="file" accept="image/*" hidden />
    </div>
    <!-- Active pane's meta chips (model · ctx% · cost · mode · agents), below the input. -->
    <div id="bar-meta" class="metarow"></div>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
