<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0f14" />
<link rel="manifest" href="/manifest.json" />
<title>tmux-rc</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* Flex-column layout: header + scrolling panes + bar. The bar is a normal flex
     child (NOT position:fixed), so when the mobile keyboard opens and shrinks the
     visual viewport, the layout compresses and the bar stays right above the keyboard
     — cards scroll within #panes instead of the whole page scrolling off. Uses dvh so
     it tracks the keyboard-adjusted viewport. */
  body {
    margin: 0; font: 15px/1.4 -apple-system, system-ui, sans-serif;
    background: #0b0f14; color: #e6edf3;
    padding: env(safe-area-inset-top) 0 0;
  }
  header {
    padding: 14px 16px; font-weight: 600; font-size: 17px;
    display: flex; justify-content: space-between; align-items: center;
    position: sticky; top: 0; z-index: 5; background: #0b0f14e6; backdrop-filter: blur(8px);
  }
  header .dot { width: 8px; height: 8px; border-radius: 50%; background: #3fb950; }
  header .off { background: #6e7681; }
  #panes { padding: 8px 12px 150px; display: flex; flex-direction: column; gap: 10px; }
  .card {
    background: #161b22; border: 1px solid #30363d; border-radius: 14px;
    padding: 12px 14px; overflow: hidden;
  }
  .card.waiting { border-color: #d29922; background: #1c1a12; }
  .card.active { border-color: #388bfd; box-shadow: 0 0 0 1px #388bfd44; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: #0d1117; border-top: 1px solid #30363d;
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px; }
  /* attach clip lives INSIDE the input field (like a chat composer) */
  .inputwrap { flex: 1; display: flex; align-items: center; background: #21262d; border: 1px solid #30363d; border-radius: 10px; padding-left: 6px; }
  .inputwrap input { flex: 1; background: transparent; border: 0; color: #e6edf3; padding: 10px 12px 10px 4px; font-size: 15px; }
  .inputwrap .attach { background: transparent; border: 0; color: #8b949e; font-size: 17px; cursor: pointer; padding: 0 4px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .icon { font-size: 20px; width: 24px; height: 24px; text-align: center; display: flex; align-items: center; justify-content: center; }
  .icon svg { display: block; }
  .pulse {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: #3fb950; margin-right: 5px; vertical-align: middle;
    animation: pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
  .meta { flex: 1; min-width: 0; }
  .name { font-weight: 600; }
  .status { color: #c9d1d9; font-size: 14px; overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .sub { color: #6e7681; font-size: 12px; margin-top: 3px; }
  .worksub { color: #6e7681; font-size: 11px; font-weight: 400; }
  .metarow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .metarow:empty { display: none; }
  .chip {
    font-size: 11px; padding: 3px 8px; border-radius: 6px; font-weight: 600;
    background: #21262d; color: #adbac7; display: inline-flex; align-items: center; gap: 5px;
  }
  .ctxchip { position: relative; overflow: hidden; }
  .ctxchip > i { position: absolute; left: 0; top: 0; bottom: 0; background: #1f6feb44; z-index: 0; }
  .ctxchip { z-index: 1; }
  .chip.mode { color: #fff; }
  .mode-plan { background: #1f6feb; }
  .mode-accept-edits { background: #238636; }
  .mode-bypass { background: #b62324; }
  .chip.agents { background: #2d2540; color: #c8a6ff; }
  .badge {
    font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 600;
    white-space: nowrap;
  }
  .b-running { background: #12331f; color: #3fb950; }
  .b-idle { background: #21262d; color: #8b949e; }
  .b-waiting { background: #3d2e0a; color: #e3b341; }
  .ctx { height: 4px; border-radius: 4px; background: #21262d; margin-top: 8px; overflow: hidden; }
  .ctx > i { display: block; height: 100%; background: #388bfd; }
  .q { margin-top: 12px; }
  /* Prompt is the prominent part (the context); options are secondary and compact so
     a long option list doesn't eat the whole card. */
  .q .prompt { font-weight: 600; font-size: 15px; margin-bottom: 8px; color: #e6edf3; }
  .opts { display: flex; flex-direction: column; gap: 5px; max-height: 40vh; overflow-y: auto; }
  button.opt {
    appearance: none; text-align: left; width: 100%;
    background: #21262d; color: #adbac7; border: 1px solid #30363d;
    border-radius: 8px; padding: 8px 12px; font-size: 13px; cursor: pointer;
  }
  button.opt:active { background: #30363d; }
  /* Structured tables: scroll horizontally AND vertically, capped so a big one doesn't
     dominate the card. */
  .tablewrap { margin-top: 12px; }
  .tbl-title { font-size: 12px; color: #8b949e; margin-bottom: 4px; }
  .tbl-scroll { max-height: 40vh; overflow: auto; border: 1px solid #30363d; border-radius: 8px; }
  .tbl-scroll table { border-collapse: collapse; font: 12px/1.3 ui-monospace, monospace; min-width: 100%; }
  .tbl-scroll th, .tbl-scroll td { padding: 5px 10px; border-bottom: 1px solid #21262d; border-right: 1px solid #21262d; white-space: nowrap; text-align: left; }
  .tbl-scroll th { background: #161b22; color: #c9d1d9; position: sticky; top: 0; }
  .tbl-scroll td { color: #adbac7; }
  .freetext { display: flex; gap: 8px; }
  .freetext input { flex: 1; background: #21262d; border: 1px solid #30363d; color: #e6edf3; border-radius: 10px; padding: 10px 12px; font-size: 15px; }
  .freetext button.send { background: #388bfd; border: 0; color: #fff; border-radius: 10px; padding: 0 16px; font-weight: 600; }
  .freetext button.attach, .freetext button.paste { background: #21262d; border: 1px solid #30363d; color: #adbac7; border-radius: 10px; padding: 0 10px; font-size: 17px; cursor: pointer; }
  .events { margin-top: 12px; display: flex; flex-direction: column; gap: 6px;
    max-height: 40vh; overflow-y: auto; }
  .events::-webkit-scrollbar { width: 6px; } .events::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
  .ev { display: flex; align-items: baseline; gap: 10px; }
  .ev-text { flex: 1; color: #c9d1d9; font-size: 13px; min-width: 0; }
  .ev-note { flex: 0 0 auto; color: #6e7681; font-size: 11px; font-family: ui-monospace, monospace;
    white-space: nowrap; max-width: 45%; overflow: hidden; text-overflow: ellipsis; text-align: right; }
  .ev-note .add { color: #3fb950; } .ev-note .del { color: #f85149; margin-left: 3px; }
  .tasks { margin-top: 12px; border: 1px solid #30363d; border-radius: 10px; overflow: hidden; }
  .tasks-head { padding: 6px 12px; font-weight: 600; font-size: 12px; background: #161b22; color: #8b949e; border-bottom: 1px solid #30363d; }
  .task { padding: 6px 12px; font-size: 13px; color: #c9d1d9; display: flex; gap: 8px; }
  .task.done { color: #6e7681; text-decoration: line-through; }
  .task .tick { color: #3fb950; }
  .notable { margin-top: 10px; display: flex; flex-direction: column; gap: 4px; }
  .rewind { margin-top: 12px; border: 1px solid #30363d; border-radius: 10px; overflow: hidden; }
  .rw-head { padding: 8px 12px; font-weight: 600; font-size: 13px; background: #161b22; border-bottom: 1px solid #30363d; }
  .rw-more { color: #6e7681; font-weight: 400; }
  .rw-entry { display: flex; gap: 8px; align-items: baseline; padding: 8px 12px; font-size: 13px; border-bottom: 1px solid #21262d; }
  .rw-entry.sel { background: #1f2b3d; }
  .rw-cursor { width: 12px; color: #58a6ff; font-weight: 700; }
  .rw-text { flex: 1; color: #c9d1d9; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rw-entry.sel .rw-text { color: #fff; font-weight: 600; }
  .rw-note { color: #6e7681; font-size: 11px; white-space: nowrap; }
  .rw-note .add { color: #3fb950; } .rw-note .del { color: #f85149; }
  .rw-hint { padding: 8px 12px; font-size: 12px; color: #6e7681; }
  .raw { margin-top: 12px; }
  .raw .freetext { margin-bottom: 8px; }
  .keys { display: flex; gap: 6px; flex-wrap: wrap; }
  .keys button {
    background: #21262d; color: #adbac7; border: 1px solid #30363d;
    border-radius: 8px; padding: 8px 12px; font-size: 13px; cursor: pointer;
  }
  .keys button:active { background: #30363d; }
  .viewbtn { margin-top: 12px; background: transparent; border: 0; color: #8b949e;
    font-size: 13px; cursor: pointer; padding: 2px 0; }
  .viewbtn:active { color: #c9d1d9; }
  /* Full-screen raw-capture view, opened on demand (no poll flicker). */
  .screen-overlay { position: fixed; inset: 0; z-index: 50; background: #000000e6;
    display: flex; flex-direction: column; padding: env(safe-area-inset-top) 0 0; }
  .screen-head { display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px; border-bottom: 1px solid #30363d; font-weight: 600; }
  .screen-close { background: #21262d; border: 1px solid #30363d; color: #e6edf3;
    border-radius: 8px; width: 34px; height: 34px; font-size: 16px; cursor: pointer; }
  /* Pinch-to-zoom + pan the terminal content. The body is the gesture surface
     (touch-action:none so our JS owns pinch/drag); the <pre> is transformed. */
  .screen-body { flex: 1; overflow: hidden; touch-action: none; position: relative; }
  .screen-pre { margin: 0; padding: 12px 16px; white-space: pre; will-change: transform;
    font: 12px/1.3 ui-monospace, monospace; color: #c9d1d9; }
  .empty { text-align: center; color: #6e7681; padding: 60px 20px; }
  .hdr-right { display: flex; align-items: center; gap: 10px; }
  .usage { font-size: 11px; color: #8b949e; font-family: ui-monospace, monospace; font-weight: 400; }
  .usage .err { color: #f85149; }
  .usage .warn { color: #e3b341; }  /* transient LLM error hint, subtle not shouty */
.links { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 2px; }
.linkbtn { display: inline-block; padding: 6px 10px; border-radius: 8px;
  background: #1d3b53; color: #8ecbff; text-decoration: none; font-size: 13px; }
.linkbtn:active { background: #27506f; }
.screen-pre a { color: #8ecbff; }
</style>
</head>
<body>
  <header>
    <span>tmux-rc</span>
    <span class="hdr-right">
      <span id="usage" class="usage"></span>
      <span id="live" class="dot off" title="connection"></span>
    </span>
  </header>
  <div id="panes"><div class="empty">Connecting…</div></div>
  <!-- Single persistent input bar, fixed at the bottom. Targets the active card. -->
  <div id="bar">
    <div class="keys">
      <button data-k="Enter">⏎ Enter</button>
      <button data-k="Escape">Esc</button>
      <button data-k="Up">↑</button>
      <button data-k="Down">↓</button>
      <button data-k="C-o">Ctrl-O</button>
      <button id="bar-prefix" data-k="C-b" title="tmux prefix">Prefix</button>
      <button data-k="C-c">Ctrl-C</button>
    </div>
    <div class="freetext">
      <div class="inputwrap">
        <button id="bar-attach" class="attach" title="Attach image">📎</button>
        <input id="bar-input" placeholder="Type…" type="text" inputmode="text"
               autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
               enterkeyhint="send" name="tmux-rc-cmd" />
      </div>
      <button id="bar-send" class="send">Send</button>
      <input id="bar-file" type="file" accept="image/*" hidden />
    </div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
