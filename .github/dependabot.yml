version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # One PR per week for routine bumps; security fixes still open on their own.
      python-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      browser-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Pinned only for its license text: it must match the runtime version
      # embedded in markdown-it's prebuilt browser bundle, which only an
      # upstream markdown-it rebuild changes (vendor:check enforces this).
      # Bump it by hand alongside markdown-it.
      - dependency-name: "@oxc-project/runtime"
