name: Native shell

# The phone app in native/ (docs/design/native-app.md). A PR that touches it must still
# produce both apps; a manual run also signs the iOS one and uploads it to TestFlight.
on:
  pull_request:
    paths: ["native/**", ".github/workflows/native.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: native

jobs:
  ios-simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: make sim
      - run: ./sim-shots.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ios-simulator-app
          path: |
            native/build/ios/Build/Products/Debug-iphonesimulator/App.app
            native/build/shots
          if-no-files-found: error

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - run: make apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-debug-apk
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # Does nothing useful until the five secrets exist: `make archive` names the first one missing.
  testflight:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    env:
      TMUXRC_APP_ID: ${{ secrets.APP_BUNDLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
      - run: make archive ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
