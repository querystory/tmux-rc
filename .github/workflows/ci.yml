name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      # The suite shells out to tmux (find_pane, capture, send-keys).
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: uv run pytest -q tests/
