name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  browser-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci --ignore-scripts
      - run: npm run vendor:check
      - run: node --test tests/*.mjs
      - run: npm audit --omit=dev --audit-level=moderate

  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs: a retargeted or compromised
      # upstream tag can't change what CI runs. Dependabot (github-actions)
      # bumps these and rewrites the trailing version comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: auto
          # Pin the interpreter so a new runner image can't silently change it.
          # pyproject requires >=3.12; uv fetches this itself, no setup-python needed.
          python-version: "3.12"
      - run: uv sync --locked
      # Lint before the suite: a ruleset nothing enforces is not a gate. Runs in a fresh
      # clone, which is the case the local .git/info/exclude can't cover. ruff is pinned
      # in the dev group, so this is the same version everyone runs locally.
      - run: uv run ruff check .
      # The suite shells out to tmux (find_pane, capture, send-keys).
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: uv run pytest -q tests/

  agent-history:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-history
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent-history/go.mod
          cache: false # no dependencies to cache
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
